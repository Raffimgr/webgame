<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ridge Admin</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Shenandoah Cabin"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: top bar, four tabs (Record, Games, Members, Settings), one column of raised panels.
   Outside the games the family are "members" (Sako, 2026-10-20); the Record and Games tabs still say players, since there they played a game. */
:root{color-scheme:dark;--bg:#1b1d22;--fg:#eef1f6;--mut:#9aa3b3;--dim:#6b7383;--ink:#15181e;--sheet:#2a2e35;--acc:#2ec4b6;
  --raise:linear-gradient(145deg,#30343c,#25282e);--raise-sh:-5px -5px 12px rgba(255,255,255,.035),7px 9px 18px rgba(0,0,0,.55);
  --well:#202328;--well-sh:inset 4px 4px 10px rgba(0,0,0,.55),inset -3px -3px 8px rgba(255,255,255,.035);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--play:"Fredoka","Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;flex:1;font:600 26px var(--play);min-width:150px}
.top .pill{min-height:40px}
.top h1 small{display:block;font:500 13px var(--font);color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut);background:var(--raise);box-shadow:var(--raise-sh);text-decoration:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;border-radius:18px;background:var(--well);box-shadow:var(--well-sh)}
.tabs button{padding:10px 4px;border-radius:13px;text-align:center;font-weight:700;color:var(--mut);font-size:14px}
.tabs button.on{background:var(--acc);color:var(--ink)}
.panel{background:var(--raise);box-shadow:var(--raise-sh);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:600 20px var(--play)}
.lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.in{width:100%;padding:12px 13px;border-radius:13px;border:0;background:var(--well);color:var(--fg);font:500 15px var(--font);box-shadow:var(--well-sh);min-width:0}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa3b3 50%),linear-gradient(135deg,#9aa3b3 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:14px;background:var(--well);box-shadow:var(--well-sh)}
.seg button{padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button.on{background:#3a3f48;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;background:#3a3f48;color:var(--fg);text-decoration:none}
.btn.main{background:var(--acc);color:var(--ink);box-shadow:0 0 16px rgba(46,196,182,.35)}
.btn.warn{background:#4a2c30;color:#ffb3b3}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 0 auto auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--well);box-shadow:var(--well-sh)}
.prow.off{opacity:.42}
.prow .nm{font-weight:650;display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;text-align:left}
.prow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#33383f;color:transparent;font-weight:900}
.prow:not(.off) .chk{background:var(--acc);color:var(--ink)}
.num{width:64px;text-align:center;padding:9px 6px}
.coin{min-width:58px;text-align:right;font:700 16px var(--play);color:#ffd23f;font-variant-numeric:tabular-nums}
.coin small{font:600 11px var(--font);color:var(--dim);display:block}
.teamsel{width:96px;padding:9px 26px 9px 9px;font-size:13px}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) 0 auto auto;gap:8px}.prow .coin{display:none}.teamsel{width:84px}}
.teams{display:flex;flex-wrap:wrap;gap:10px}
.team{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--well);box-shadow:var(--well-sh)}
.team input{width:110px}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo img{width:140px;height:100px;object-fit:cover;border-radius:14px;box-shadow:var(--raise-sh)}
.photo .ph-none{width:140px;height:100px;border-radius:14px;display:grid;place-items:center;background:var(--well);box-shadow:var(--well-sh);color:var(--dim);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ev{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--well-sh);align-items:center}
.ev>div:first-child{min-width:0;overflow-wrap:anywhere}
.ev b{font:600 17px var(--play)}
.ev .meta{color:var(--mut);font-size:13px}
.ev .tag{white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#4a3d1c;color:#ffd23f;margin-left:6px;vertical-align:middle}
.ev .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* Game log: day headings, hidden (practice) games dimmed, a select mode for cleaning up several at once. */
.ev .tag.hid{background:#33303f;color:#c9b8ff}
.ev.off>div:first-child{opacity:.6}
#t-ev .ev{grid-template-columns:1fr}
#t-ev .ev .btns{justify-content:flex-start}
#t-ev .ev.pick{grid-template-columns:auto 1fr;cursor:pointer}
#lf button{white-space:nowrap;padding:8px 11px}
.ev .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--ink)}
.ev.sel{outline:2px solid var(--acc)}
.ev.sel .ck{background:var(--acc);border-color:var(--acc)}
.day{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:10px 4px 0}
.logbar{position:sticky;top:8px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-radius:16px;background:#2b3038;box-shadow:var(--raise-sh)}
.pp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;overflow-wrap:anywhere;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--well);box-shadow:var(--well-sh)}
.pp .sub{color:var(--mut);font-size:12.5px}
.coins-ed{display:flex;flex-wrap:wrap;gap:8px}
.coins-ed label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);font-weight:700}
.coins-ed input{width:62px;text-align:center}
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(15,17,21,.8)}
.sheet .panel{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--sheet)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--x)}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--x)}
.empty{color:var(--mut);text-align:center;padding:18px}
.hint{color:var(--mut);font-size:13px;margin:0}
html.rg-nav-on .sheet{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#t-set{display:flex;flex-direction:column;gap:16px}
.alist{display:flex;flex-direction:column;gap:8px}
.ar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 12px;border-radius:16px;background:var(--well);box-shadow:var(--well-sh)}
.ar b{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ar b small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.tg{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px;font-size:11.5px;font-weight:700;color:var(--mut)}
.tg:disabled{opacity:.45;cursor:default}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:#3a3f48;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#eef1f6;transition:transform .2s}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(20px)}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ogi{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border-radius:14px;background:var(--well);box-shadow:var(--well-sh);font-weight:600;font-size:14px;text-align:left}
.ogi .chk{width:26px;height:26px;border-radius:8px}
.ogi.on .chk{background:var(--acc);color:var(--ink)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cnt div{padding:10px 14px;border-radius:16px;background:var(--well);box-shadow:var(--well-sh)}
.cnt b{display:block;font:600 30px/1.1 var(--play)}
.cnt span{font-size:12.5px;font-weight:600;color:var(--mut)}
.lab .n{color:var(--acc);margin-left:6px}
.ll-last{display:flex;flex-wrap:wrap;gap:8px}
.ll-last button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--well);box-shadow:var(--well-sh);color:var(--fg);text-align:left}
.ll-last button.on{outline:2px solid var(--acc)}
.ll-last small{display:block;color:var(--mut);font-size:11.5px;font-weight:500;line-height:1.2}
.ll-last b{font-weight:650;font-size:13.5px;line-height:1.2}
.ll-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px;border-radius:14px;background:var(--well);box-shadow:var(--well-sh)}
.ll-row b{font-weight:650}
.ll-row .ll-d{display:block;color:var(--mut);font-size:12.5px}
.ll-row time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.ll-row time small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.ll-k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--dim)}
.ll-k.login{background:var(--acc)}.ll-k.logout{background:#ff8f8f}.ll-k.fail,.ll-k.nopass{background:#ffd23f}
.top #logBtn{margin-left:auto}.top #logBtn.on{background:var(--acc);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Admin <small>Record games, members, passwords and settings</small></h1><span class="pill" id="who"></span><a class="pill" href="scores.html">Dashboard</a><a class="pill" href="games.html">Home</a><button class="pill" id="logBtn">🕘 Log</button></div>
  <div class="tabs" id="tabs"><button data-t="rec" class="on">Record</button><button data-t="ev">Game log</button><button data-t="pl">Members</button><button data-t="set">Settings</button></div>
  <section id="t-rec"></section>
  <section id="t-ev" hidden></section>
  <section id="t-pl" hidden></section>
  <section id="t-set" hidden></section>
  <section id="t-log" hidden><div id="loginLog" style="display:flex;flex-direction:column;gap:16px"></div></section>
</div>
<script src="mind.js"></script>
<script src="rg.js?v=10"></script>
<script>
(async function(){
const {api,av,esc,toast}=RG;
const COLORS=["#d4f09a","#f7b8d2","#aab7ff","#ffe08a","#ffbf99","#ff9fb8","#7ee8f0","#9df0c8","#d8c39a","#c9a7ff","#7be08a","#ff8f70"];
let me,players=[],screens=[],events=[],coins=[],access={nofeed:[],nochat:[],nogames:[],open:[]},crown={off:[],fee:5};
try{const r=await RG.login({admin:true});me=r.me;if(r.state.access)access=Object.assign(access,r.state.access);if(r.state.crown)crown=Object.assign(crown,r.state.crown)}catch(e){document.querySelector(".wrap").innerHTML=`<div class="panel"><h2>Can't reach the server</h2><p class="hint">${esc(e.message)} The admin page only works on the website itself.</p><a class="btn" href="games.html">Home</a></div>`;return}
document.getElementById("who").innerHTML=`${av(me,22)} ${esc(me.name)} · <button id="out" style="color:#9aa3b3;font-weight:600">Log out</button>`;
document.getElementById("out").onclick=async()=>{try{await api("logout",{})}catch(x){}location.reload()};

const setPlayers=l=>{players=l.filter(p=>!p.screen);screens=l.filter(p=>p.screen)}; // the Score screen only shows under Members (for its password), never in game lists
async function load(){const r=await api("events");events=r.events;setPlayers(r.players);coins=r.coins}
try{await load()}catch(e){document.querySelector(".wrap").innerHTML=`<div class="panel"><h2>Couldn't load the games</h2><p class="hint">${esc(e.message)}</p><a class="btn" href="admin.html">Try again</a></div>`;return}
const P=id=>players.find(p=>p.id===id)||{id,name:id,short:"?",color:"#9aa3b3"};
const coinFor=pl=>pl>=1&&pl<=coins.length?coins[pl-1]:0;

/* ---------- tabs ---------- */
const tabs=document.getElementById("tabs");
// the login log has its own button at the top right (Raffi, 2026-10-21), not a panel in Settings
const logBtn=document.getElementById("logBtn");logBtn.onclick=()=>show("log");
function show(t){tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));logBtn.classList.toggle("on",t==="log");["rec","ev","pl","set","log"].forEach(k=>document.getElementById("t-"+k).hidden=k!==t);({rec:drawRec,ev:drawEvents,pl:drawPlayers,set:drawSettings,log:drawLoginLog})[t]()}
tabs.onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)};

/* ---------- record form ---------- */
let F=null; // the form being edited
function blank(){if(F&&F.photo)URL.revokeObjectURL(F.photo);return {id:0,game:"",category:"",mode:"solo",played_at:RG.nowLocal(),score_dir:"high",note:"",status:"open",hidden:0,teams:["Team 1","Team 2"],teamPlace:{},rows:{},photo:null,photoBlob:null,has_photo:0,photoV:Date.now()}}
function fromEvent(e){
  const f=blank();Object.assign(f,{id:e.id,game:e.game,category:e.category,mode:e.mode,played_at:e.played_at,score_dir:e.score_dir,note:e.note,status:e.status,hidden:e.hidden,has_photo:e.has_photo});
  const tn=[...new Set(e.results.map(r=>r.team).filter(Boolean))];if(tn.length)f.teams=tn;
  e.results.forEach(r=>{f.rows[r.player_id]={on:true,place:r.place??"",score:r.score??"",team:r.team||f.teams[0]};if(r.team&&r.place)f.teamPlace[r.team]=r.place});
  return f;
}
const q=new URLSearchParams(location.search);
F=blank();
function knownGames(){const s=new Set();Object.values(RG.GAMES).flat().forEach(g=>s.add(g));events.forEach(e=>s.add(e.game));return [...s].sort()}
function catOf(g){for(const[c,l]of Object.entries(RG.GAMES))if(l.includes(g))return c;return ""}
// From a card or mind game: ?record=1&game=<name>&order=<ids best first>[&places=1,1,3 for ties][&bonus=4,4,2 extra coins per player, e.g. for seconds left]
if(q.get("record")){F.game=(q.get("game")||"").slice(0,60);const all=(q.get("order")||"").split(","),pls=(q.get("places")||"").split(",").map(Number),bon=(q.get("bonus")||"").split(",").map(Number);
  all.forEach((id,i)=>{if(!players.some(p=>p.id===id&&p.active))return;F.rows[id]={on:true,place:pls[i]>=1?Math.round(pls[i]):i+1,score:"",team:F.teams[0]};if(bon[i]>0)F.rows[id].bonus=Math.round(bon[i])});
  F.category=catOf(F.game)||(/poker|card|blackjack|higher/i.test(F.game)?"Cards":"");history.replaceState(null,"","admin.html")}

function drawRec(){
  const el=document.getElementById("t-rec");
  const active=players.filter(p=>p.active||(F.rows[p.id]&&F.rows[p.id].on)); // hidden players stay visible in games they played
  el.innerHTML=`<div class="panel">
    <h2>${F.id?"Edit game":"Record a game"}</h2>
    <div class="row">
      <label><span class="lab">Game</span><input class="in" id="f-game" list="gl" value="${esc(F.game)}" placeholder="Pick or type a game"><datalist id="gl">${knownGames().map(g=>`<option value="${esc(g)}">`).join("")}</datalist></label>
      <label><span class="lab">Category</span><select class="in" id="f-cat">${["","Party","Arcade","Mind games","Cards","Grand game","Puzzles","Elimination","Outdoor","Other"].map(c=>`<option ${c===F.category?"selected":""} value="${c}">${c||"Choose"}</option>`).join("")}</select></label>
      <label><span class="lab">When</span><input class="in" type="datetime-local" id="f-when" value="${esc(F.played_at)}"></label>
    </div>
    <div class="row" style="align-items:center;gap:16px">
      <div><div class="lab">Play as</div><div class="seg" id="f-mode"><button data-m="solo" class="${F.mode==="solo"?"on":""}">Everyone for themselves</button><button data-m="teams" class="${F.mode==="teams"?"on":""}">Teams</button></div></div>
      <div><div class="lab">Best score is</div><div class="seg" id="f-dir"><button data-d="high" class="${F.score_dir==="high"?"on":""}">Highest</button><button data-d="low" class="${F.score_dir==="low"?"on":""}">Lowest</button></div></div>
    </div>
    ${F.mode==="teams"?`<div><div class="lab" style="margin-bottom:6px">Teams and their place</div><div class="teams">${F.teams.map((t,i)=>`<div class="team"><input class="in" data-ti="${i}" value="${esc(t)}" maxlength="40" aria-label="Team name"><input class="in num" type="number" min="1" inputmode="numeric" data-tp="${i}" value="${esc(F.teamPlace[t]??"")}" placeholder="Place"><span class="coin">${coinFor(+F.teamPlace[t])} <small>each</small></span></div>`).join("")}<button class="btn sm" id="addteam">＋ Team</button>${F.teams.length>2?`<button class="btn sm" id="delteam">− Team</button>`:""}</div></div>`:""}
    <div>
      <div class="lab" style="margin-bottom:6px">Players · tap a name to add or remove · ${F.mode==="teams"?"pick each player's team":"type the place, or type scores and press Places from scores"}</div>
      <div class="plist">${active.map(p=>{const r=F.rows[p.id]||{};const on=!!r.on;const pl=F.mode==="teams"?F.teamPlace[r.team||F.teams[0]]:r.place;
        return `<div class="prow ${on?"":"off"}" data-p="${esc(p.id)}"><button class="nm" data-tog="${esc(p.id)}"><span class="chk">✓</span>${av(p,32)}<span>${esc(p.name)}</span></button>
        <span></span>
        ${F.mode==="teams"?`<select class="in teamsel" data-team="${esc(p.id)}" aria-label="Team" ${on?"":"disabled"}>${F.teams.map(t=>`<option ${t===(r.team||F.teams[0])?"selected":""}>${esc(t)}</option>`).join("")}</select>`:`<input class="in num" type="number" min="1" inputmode="numeric" placeholder="Place" aria-label="Place" data-place="${esc(p.id)}" value="${esc(r.place??"")}" ${on?"":"disabled"}>`}
        <input class="in num" type="number" inputmode="decimal" step="any" placeholder="Score" aria-label="Score" data-score="${esc(p.id)}" value="${esc(r.score??"")}" ${on?"":"disabled"}>
        <span class="coin">${on&&pl?coinFor(+pl)+(r.bonus?"+"+r.bonus:""):"–"}<small>coins</small></span></div>`}).join("")}</div>
      <div class="actions" style="justify-content:flex-start;margin-top:10px">
        <button class="btn sm" id="allin">Everyone played</button>
        ${F.mode==="solo"?`<button class="btn sm" id="auto">Places from scores</button>`:""}
      </div>
    </div>
    <div>
      <div class="lab" style="margin-bottom:6px">Photo of this game</div>
      <div class="photo">
        ${F.photo?`<img src="${F.photo}" alt="Photo for this game">`:F.has_photo&&F.id?`<img src="api.php?a=photo&id=${F.id}&t=${F.photoV}" alt="Photo for this game">`:`<span class="ph-none">No photo yet</span>`}
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="btn sm">Take photo<input type="file" accept="image/*" capture="environment" id="ph-cam" hidden></label>

  el.querySelectorAll("[data-place]").forEach(i=>i.onchange=()=>{F.rows[i.dataset.place].place=i.value;drawRec()});
  el.querySelectorAll("[data-score]").forEach(i=>i.onchange=()=>{F.rows[i.dataset.score].score=i.value});

async function save(status){
  if(!F.game.trim())return toast("Pick or type the game first.");
  const rows=Object.entries(F.rows).filter(([,r])=>r.on);
  if(!rows.length)return toast("Tap the players who played.");
  const results=rows.map(([id,r])=>Object.assign(F.mode==="teams"?{player_id:id,team:r.team||F.teams[0],place:F.teamPlace[r.team||F.teams[0]]||null,score:r.score}:{player_id:id,place:r.place||null,score:r.score},r.bonus!=null?{bonus:r.bonus}:{}));
  if(status==="done"&&results.some(r=>!r.place))return toast(F.mode==="teams"?"Give every team a place.":"Give every player a place (or use Places from scores).");
  const btns=document.querySelectorAll("#t-rec .actions .btn");btns.forEach(b=>b.disabled=true);
  try{
    const r=await api("event_save",{id:F.id,game:F.game.trim(),category:F.category,mode:F.mode,played_at:F.played_at,status,note:F.note,score_dir:F.score_dir,hidden:F.hidden,results});
    F.id=r.event.id;F.status=status; // saved: a retry now edits this game instead of making a second one
    if(F.photoBlob){
      try{await api("photo_upload",F.photoBlob,{q:"&event="+r.event.id})}
      catch(x){await load().catch(()=>{});drawRec();toast("The game is saved, but the photo didn't upload ("+x.message+"). Press save again to retry.");return}
    }
    await load();
    toast(status!=="done"?"Saved. Finish it from the Game log when it's over.":F.hidden?"Saved as practice, off the scoreboard.":"Recorded on the dashboard.");
    F=blank();show(status==="done"?"ev":"rec");
  }catch(x){toast(x.message);btns.forEach(b=>b.disabled=false)}
}

/* ---------- game log ---------- */
let logF="all",sel=null; // sel: the ticked games while selecting, else null
function drawEvents(){
  const el=document.getElementById("t-ev");
  const live=events.filter(e=>!e.deleted_at),gone=events.filter(e=>e.deleted_at);
  const views={all:["All",live],on:["On board",live.filter(e=>!e.hidden)],hid:["Hidden",live.filter(e=>e.hidden)],del:["Deleted",gone]};
  const list=views[logF][1];
  if(sel)[...sel].forEach(id=>{if(!list.some(e=>e.id===id))sel.delete(id)});
  const day=e=>{const d=RG.parseLocal(e.played_at);return isNaN(d)?"No date":d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
  const time=e=>{const d=RG.parseLocal(e.played_at);return isNaN(d)?"":d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})};
  const groups=[];list.forEach(e=>{const k=day(e);if(!groups.length||groups[groups.length-1][0]!==k)groups.push([k,[]]);groups[groups.length-1][1].push(e)});
  const row=e=>{
    const top=e.results.filter(r=>r.place===1).map(r=>P(r.player_id).name),by=e.created_by?P(e.created_by).name:"";
    const how=/^Played together/.test(e.note||"")?"on phones":"";
    const meta=[time(e),e.results.length+" players",top.length?"Won by "+top.join(", "):"",by?(how?"On phones, host "+by:"Recorded by "+by):"",e.has_photo?"photo":"",e.deleted_at?"Deleted "+RG.fmtDate(e.deleted_at):""].filter(Boolean);
    const btns=sel?"":e.deleted_at?`<button class="btn sm" data-res="${e.id}">Restore</button><button class="btn sm warn" data-gone="${e.id}">Delete forever</button>`
      :`${e.status==="open"?`<button class="btn sm main" data-fin="${e.id}">Finish</button>`:""}<button class="btn sm" data-hide="${e.id}">${e.hidden?"Show on board":"Hide"}</button><button class="btn sm" data-ed="${e.id}">Edit</button><button class="btn sm warn" data-del="${e.id}">Delete</button>`;
    return `<div class="ev${e.hidden||e.deleted_at?" off":""}${sel?" pick":""}${sel&&sel.has(e.id)?" sel":""}" data-row="${e.id}">${sel?`<span class="ck">${sel.has(e.id)?"✓":""}</span>`:""}<div><b>${esc(e.game)}</b>${e.status==="open"?`<span class="tag">Still playing</span>`:""}${e.hidden?`<span class="tag hid">Hidden</span>`:""}<div class="meta">${esc(meta.join(" · "))}</div></div>${btns?`<div class="btns">${btns}</div>`:""}</div>`};
  const n=sel?sel.size:0;
  const bar=!sel?"":`<div class="logbar"><b style="flex:1;min-width:110px">${n} selected</b><button class="btn sm" id="l-all">${n===list.length&&n?"None":"All"}</button>${logF==="del"
    ?`<button class="btn sm" id="l-res" ${n?"":"disabled"}>Restore</button><button class="btn sm warn" id="l-gone" ${n?"":"disabled"}>Delete forever</button>`
    :`<button class="btn sm" id="l-hide" ${n?"":"disabled"}>Hide</button><button class="btn sm" id="l-show" ${n?"":"disabled"}>Show</button><button class="btn sm warn" id="l-del" ${n?"":"disabled"}>Delete</button>`}<button class="btn sm main" id="l-done">Done</button></div>`;
  el.innerHTML=`<div class="panel"><h2>Game log</h2>
    <p class="hint">Every game played, with its date and time. Hide practice games to keep them off the scoreboard. Deleted games wait under Deleted until you restore them or delete them forever.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg" id="lf" style="max-width:100%;overflow-x:auto">${Object.entries(views).map(([k,[t,l]])=>`<button data-f="${k}" class="${k===logF?"on":""}">${t} ${l.length}</button>`).join("")}</div>${sel||!list.length?"":`<button class="btn sm" id="l-sel">Select</button>`}</div>
    ${bar}
    ${groups.length?groups.map(([k,l])=>`<div class="day"><span>${esc(k)}</span><span>${l.length} game${l.length>1?"s":""}</span></div>${l.map(row).join("")}`).join("")
      :`<p class="empty">${logF==="del"?"Nothing deleted.":logF==="hid"?"No hidden games. Hide a practice game to keep it off the scoreboard.":"No games yet. Record one from the Record tab."}</p>`}</div>`;
  const $=x=>el.querySelector(x),find=id=>events.find(e=>e.id===+id);
  const act=async(a,ids,body,msg)=>{try{await api(a,Object.assign({ids},body));if(ids.includes(F.id)&&a!=="event_hide")F=blank();await load();if(sel)sel.clear();drawEvents();toast(msg)}catch(x){toast(x.message)}};
  const plural=k=>k+" game"+(k>1?"s":"");
  $("#lf").onclick=e=>{const b=e.target.closest("button");if(b){logF=b.dataset.f;if(sel)sel.clear();drawEvents()}};
  if($("#l-sel"))$("#l-sel").onclick=()=>{sel=new Set();drawEvents()};
  if(sel){
    el.querySelectorAll("[data-row]").forEach(r=>r.onclick=()=>{const id=+r.dataset.row;sel.has(id)?sel.delete(id):sel.add(id);drawEvents()});
    $("#l-all").onclick=()=>{if(sel.size===list.length)sel.clear();else list.forEach(e=>sel.add(e.id));drawEvents()};
    $("#l-done").onclick=()=>{sel=null;drawEvents()};
    const ids=()=>[...sel];
    if($("#l-hide")){
      $("#l-hide").onclick=()=>act("event_hide",ids(),{hidden:1},plural(n)+" hidden from the scoreboard.");
      $("#l-show").onclick=()=>act("event_hide",ids(),{hidden:0},plural(n)+" back on the scoreboard.");
      $("#l-del").onclick=()=>{if(confirm(`Delete ${plural(n)}? They go to Deleted, where you can restore them.`))act("event_delete",ids(),{},"Moved to Deleted.")};
    }else{
      $("#l-res").onclick=()=>act("event_restore",ids(),{},plural(n)+" restored.");
      $("#l-gone").onclick=()=>{if(confirm(`Delete ${plural(n)} forever? Their scores and photos can't be brought back.`))act("event_forever",ids(),{},"Deleted forever.")};
    }
    return;
  }
  el.querySelectorAll("[data-ed],[data-fin]").forEach(b=>b.onclick=()=>{F=fromEvent(find(b.dataset.ed||b.dataset.fin));show("rec");scrollTo(0,0)});
  el.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>{const e=find(b.dataset.hide);act("event_hide",[e.id],{hidden:e.hidden?0:1},e.hidden?"Back on the scoreboard.":"Hidden from the scoreboard.")});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const e=find(b.dataset.del);if(confirm(`Delete ${e.game} from ${RG.fmtDate(e.played_at)}? It goes to Deleted, where you can restore it.`))act("event_delete",[e.id],{},"Moved to Deleted.")});
  el.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>act("event_restore",[+b.dataset.res],{},"Restored."));
  el.querySelectorAll("[data-gone]").forEach(b=>b.onclick=()=>{const e=find(b.dataset.gone);if(confirm(`Delete ${e.game} from ${RG.fmtDate(e.played_at)} forever? Its scores and photo can't be brought back.`))act("event_forever",[e.id],{},"Deleted forever.")});
}

async function drawLoginLog(){const el=document.getElementById("loginLog");if(!el)return;
  el.innerHTML=`<div class="panel"><h2>Who logged in</h2><p class="hint">Loading…</p></div>`;
  let log,earlier;try{const r=await api("login_log");log=r.log;earlier=r.earlier||{rows:[],before:0}}catch(x){el.querySelector(".hint").textContent=x.message;return}
  const KIND={login:"Logged in with password",open:"Opened the app",logout:"Logged out",fail:"Typed a wrong password",nopass:"Tried to log in, but has no password yet"};
  const DID={chat:["chat message","chat messages"],feed:["Feed post","Feed posts"],like:["like","likes"],comment:["comment","comments"],todo:["To-do change","To-do changes"],game:["online game started","online games started"]};
  const day=t=>{const d=new Date(t*1000),n=new Date(),y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);
    return d.toDateString()===n.toDateString()?"Today":d.toDateString()===y.toDateString()?"Yesterday":d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
  const time=t=>new Date(t*1000).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  // before the log started: one row per member per day, from what they did that day
  const days={};earlier.rows.forEach(r=>{const k=new Date(r.at*1000).toDateString()+"|"+r.pid,d=days[k]||(days[k]={pid:r.pid,at:r.at,last:r.last,n:{}});
    d.at=Math.min(d.at,r.at);d.last=Math.max(d.last,r.last);d.n[r.kind]=(d.n[r.kind]||0)+r.n});
  const eRows=Object.values(days).sort((a,b)=>b.last-a.last);
  const last={};log.forEach(r=>{if(!last[r.pid])last[r.pid]=r.at});eRows.forEach(r=>{if(!last[r.pid]||r.last>last[r.pid])last[r.pid]=r.last});
  const who=Object.keys(last).sort((a,b)=>last[b]-last[a]);
  const paint=()=>{const rows=log.filter(r=>!llWho||r.pid===llWho),shown=rows.slice(0,llShow),er=eRows.filter(r=>!llWho||r.pid===llWho),eShown=er.slice(0,llShowE);let d="",e="";
    el.innerHTML=`<div class="panel"><h2>Who logged in</h2><p class="hint">Every login, wrong password and time someone opens the app (once per half hour), for the last 90 days. Times are this device's time. Only admins see this.</p>
      ${who.length?`<div class="lab">Last seen · tap a name to see only theirs</div><div class="ll-last">${who.map(id=>{const p=P(id);return `<button data-ll="${esc(id)}" class="${llWho===id?"on":""}">${av(p,30)}<span><b>${esc(p.name)}</b><small>${day(last[id])}, ${time(last[id])}</small></span></button>`}).join("")}</div>
      ${llWho?`<div class="actions" style="justify-content:flex-start"><button class="btn sm" id="llAll">Show everyone</button></div>`:""}`:""}
      ${shown.length?`<div class="alist">${shown.map(r=>{const p=P(r.pid),h=day(r.at)!==d?`<div class="day" style="margin-top:6px">${esc(d=day(r.at))}</div>`:"";
        return h+`<div class="ll-row">${av(p,32)}<div><b>${esc(p.name)}</b><span class="ll-d"><i class="ll-k ${r.kind}"></i>${KIND[r.kind]||esc(r.kind)}${r.device?" · "+esc(r.device):""}</span></div><time>${time(r.at)}</time></div>`}).join("")}</div>`
      :`<p class="hint" style="margin:0">${llWho?"No logins from them since the log was turned on.":"Nobody has logged in since the log was turned on. New logins show up here."}</p>`}
      ${rows.length>shown.length?`<div class="actions" style="justify-content:flex-start"><button class="btn sm" id="llMore">Show older (${rows.length-shown.length} more)</button></div>`:""}</div>
      ${er.length?`<div class="panel"><h2>Before the log started</h2><p class="hint">Logins have only been recorded since ${esc(day(earlier.before).replace(/^(Today|Yesterday)$/,x=>x.toLowerCase()))}, ${esc(time(earlier.before))}. Before that, this shows when each member was using the app, from their chat messages, Feed posts, likes, comments, To-do changes and online games.</p>
      <div class="alist">${eShown.map(r=>{const p=P(r.pid),h=day(r.at)!==e?`<div class="day" style="margin-top:6px">${esc(e=day(r.at))}</div>`:"",
        what=Object.keys(DID).filter(k=>r.n[k]).map(k=>`${r.n[k]} ${DID[k][r.n[k]===1?0:1]}`).join(" · "),t=time(r.at),t2=time(r.last);
        return h+`<div class="ll-row">${av(p,32)}<div><b>${esc(p.name)}</b><span class="ll-d"><i class="ll-k"></i>${esc(what)}</span></div><time>${t}${t===t2?"":`<small>to ${t2}</small>`}</time></div>`}).join("")}</div>
      ${er.length>eShown.length?`<div class="actions" style="justify-content:flex-start"><button class="btn sm" id="llMoreE">Show older (${er.length-eShown.length} more)</button></div>`:""}</div>`:""}`;
    el.querySelectorAll("[data-ll]").forEach(b=>b.onclick=()=>{llWho=llWho===b.dataset.ll?"":b.dataset.ll;llShow=60;llShowE=40;paint()});
    const a=el.querySelector("#llAll");if(a)a.onclick=()=>{llWho="";llShow=60;llShowE=40;paint()};
    const m=el.querySelector("#llMore");if(m)m.onclick=()=>{llShow+=100;paint()};
    const m2=el.querySelector("#llMoreE");if(m2)m2.onclick=()=>{llShowE+=60;paint()}};
  paint()}

function drawAccess(){
  const el=document.getElementById("acc");if(!el)return;el.innerHTML=accessHTML();
  const flip=(l,v)=>{const i=l.indexOf(v);if(i>=0)l.splice(i,1);else l.push(v);drawAccess();saveAccess()};
  el.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>flip(access[b.dataset.acc],b.dataset.p));
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>flip(access.open,b.dataset.open));
  const cb=el.querySelector('[data-open="crown"]');if(cb&&RG.CROWN_GAMES){cb.insertAdjacentHTML("afterend",`<button class="ogi" id="toCrownSet">⚙ Pick the map games ›</button>`);el.querySelector("#toCrownSet").onclick=()=>{const t=document.getElementById("crownSet");if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}}
}

/* ---------- The Road to the Crown: which games can land on the map, and the player-swap fee ---------- */
function crownHTML(){
  if(!RG.CROWN_GAMES)return "";
  const on=g=>!crown.off.includes(g);
  return `<div class="panel" id="crownSet"><h2>The Road to the Crown</h2><p class="hint">Pick the games that can land on the map. Each new map shuffles the ticked games onto its stops. Each group keeps at least one game.</p>
    ${RG.CROWN_GAMES.map(([grp,list])=>`<div class="lab">${esc(grp)}<span class="n">${list.filter(on).length} of ${list.length}</span></div><div class="og">${list.map(g=>`<button class="ogi${on(g)?" on":""}" data-cg="${esc(g)}" aria-pressed="${on(g)}"><span class="chk">✓</span>${esc(g)}</button>`).join("")}</div>`).join("")}
    <div class="lab" style="margin-top:14px">Player swap fee</div><p class="hint">During a game a team can swap a player. Everyone on that team pays this many coins, taken off their coins for that game.</p>
    <div class="seg" id="cfee">${[0,2,3,5,10].map(n=>`<button class="${crown.fee===n?"on":""}" data-fee="${n}">${n} coin${n===1?"":"s"}</button>`).join("")}</div></div>`}
let crownSave=Promise.resolve();
function drawCrown(){const el=document.getElementById("crownBox");if(!el)return;el.innerHTML=crownHTML();
  const save=()=>{const c=JSON.parse(JSON.stringify(crown));crownSave=crownSave.then(()=>api("settings_save",{crown:c})).then(r=>{if(r.crown)crown=r.crown;toast("Saved.")},x=>toast(x.message))};
  el.querySelectorAll("[data-cg]").forEach(b=>b.onclick=()=>{const g=b.dataset.cg,i=crown.off.indexOf(g);
    if(i>=0)crown.off.splice(i,1);else{const grp=RG.CROWN_GAMES.find(([,l])=>l.includes(g))[1];if(grp.filter(x=>!crown.off.includes(x)).length<=1){toast("Keep at least one game in this group.");return}crown.off.push(g)}
    drawCrown();save()});
  el.querySelectorAll("[data-fee]").forEach(b=>b.onclick=()=>{crown.fee=+b.dataset.fee;drawCrown();save()})}

/* ---------- settings ---------- */
function drawSettings(){
  const el=document.getElementById("t-set");
  el.innerHTML=`<div id="acc" style="display:flex;flex-direction:column;gap:16px"></div><div id="crownBox"></div><div class="panel"><h2>Coins for each place</h2><p class="hint">Every game gives coins by place. Places past the last box get nothing. Changing this re-counts every game already recorded.</p>
    <div class="coins-ed" id="ce">${coins.map((c,i)=>`<label>${RG.ordinal(i+1)}<input class="in" type="number" min="0" inputmode="numeric" value="${c}"></label>`).join("")}</div>
    <div class="actions" style="justify-content:flex-start"><button class="btn sm" id="cadd">＋ Place</button><button class="btn sm" id="cdel">− Place</button><span style="flex:1"></span><button class="btn main" id="csave">Save coins</button></div></div>
  <div class="panel"><h2>Backup</h2><p class="hint">Download every member, game and score as one file (photos stay on the server).</p><div class="actions" style="justify-content:flex-start"><a class="btn" href="api.php?a=export" download>Download backup</a></div></div>
  <div class="panel"><h2>Front page</h2><p class="hint" id="fr-h">Checking…</p><div class="actions" style="justify-content:flex-start"><button class="btn" id="fr" hidden></button></div></div>`;
  (async()=>{const h=el.querySelector("#fr-h"),b=el.querySelector("#fr");
    const paint=on=>{h.textContent=on?"raffaelco.com sends visitors straight to the games.":"raffaelco.com does not open the games. Use raffaelco.com/DM/.";b.textContent=on?"Stop sending raffaelco.com here":"Make raffaelco.com open the games";b.hidden=false;b.onclick=async()=>{b.disabled=true;try{const r=await api("settings_save",{front:!on});paint(r.front);toast("Saved.")}catch(x){toast(x.message)}b.disabled=false}};
    try{const r=await api("front");if(!r.possible){h.textContent="Only available on the real website.";return}paint(r.front)}catch(x){h.textContent=x.message}})();
  drawAccess();drawCrown();
  const read=()=>[...el.querySelectorAll("#ce input")].map(i=>+i.value||0);
  el.querySelector("#cadd").onclick=()=>{coins=[...read(),0];drawSettings()};
  el.querySelector("#cdel").onclick=()=>{coins=read().slice(0,-1);if(!coins.length)coins=[10];drawSettings()};
  el.querySelector("#csave").onclick=async()=>{try{const r=await api("settings_save",{coins:read()});coins=r.coins;await load();toast("Coins saved and every game re-counted.")}catch(x){toast(x.message)}};
}

show("rec");
})();
</script>
