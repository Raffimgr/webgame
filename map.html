<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road to the Crown</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Shenandoah Cabin"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iPad landscape first. A bright storybook strategy map (land, river, sandy roads, stone stops, a castle) fills the left; the soft-charcoal side panel from the Ridge Games scoreboard sits on the right. Stacks on a phone. Dark panel by design, so one look in both themes. */
:root{
  color-scheme:dark;
  --bg:#1b1d22; --fg:#eef1f6; --mut:#9aa3b3; --dim:#6b7383; --ink:#15181e; --sheet:#2a2e35; --toast:#2b3038;
  --adv:#7ee8f0; --pink:#f7b8d2; --gold:#ffe08a; --royal:#e0459b;
  --raise:linear-gradient(145deg,#30343c,#25282e);
  --raise-sh:-5px -5px 12px rgba(255,255,255,.035),7px 9px 18px rgba(0,0,0,.55);
  --well:#202328;
  --well-sh:inset 4px 4px 10px rgba(0,0,0,.55),inset -3px -3px 8px rgba(255,255,255,.035);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --play:"Fredoka","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;background:linear-gradient(170deg,#2c3037 0%,#22252b 55%,#1b1d22 100%);z-index:-1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible{outline:2px solid var(--adv);outline-offset:3px}
.raise{background:var(--raise);box-shadow:var(--raise-sh)}
.well{background:var(--well);box-shadow:var(--well-sh)}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.top h1{margin:0;font:600 24px var(--play);flex:1;min-width:0;letter-spacing:.01em}
.top h1 small{display:block;font:500 12.5px var(--font);color:var(--mut)}
.pill{padding:9px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.mapbox{border-radius:26px;padding:10px}
.mapbox svg{display:block;width:100%;height:auto;border-radius:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 2px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a7acb4,#565b63);border:3px solid var(--x);display:inline-block}

/* map */
.node{cursor:default}
.node.opt{cursor:pointer}
.node .num{font:700 17px var(--play);fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#2b2f36;stroke-width:3px;pointer-events:none}
.node .badge text{font:700 10px var(--font);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.opt .pulse{fill:none;stroke:#fff;stroke-width:3}
.livering{fill:none;stroke:#ffd23f;stroke-width:5;pointer-events:none}
#map *{pointer-events:none}#map .node.opt,#map .node.opt *{pointer-events:auto} /* only glowing stops take taps (a token or tree drawn on top must not swallow them) */
@media (prefers-reduced-motion:no-preference){
  .node.opt .pulse{animation:pulse 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .livering{animation:pulse 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{from{transform:scale(1);opacity:1}to{transform:scale(1.65);opacity:0}}
  .flag{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
  @keyframes wave{50%{transform:skewY(-8deg) scaleX(.9)}}
  .cloud{animation:drift 40s linear infinite alternate}
  @keyframes drift{to{transform:translateX(60px)}}
}
.node.opt:hover .stone,.node.opt:focus-visible .stone{filter:brightness(1.2)}
.node:focus{outline:none}
.tok{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
.tok text{font:700 13px var(--play);fill:#15181e;text-anchor:middle;dominant-baseline:central}

/* panel */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{border-radius:22px;padding:14px}
.turn{display:flex;flex-direction:column;gap:10px}
.turn .who{display:flex;align-items:center;gap:10px}
.turn .who b{font:600 19px var(--play)}
.turn .who small{display:block;color:var(--mut);font-size:12.5px;font-weight:500}
.dot{width:14px;height:14px;border-radius:50%;background:var(--x);box-shadow:0 0 10px var(--x);flex:none}
.team{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--x)}
.team .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.team .hd .st{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600;text-align:right}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:10.5px;color:var(--ink);background:var(--x);position:relative}
.av.frz{opacity:.45;outline:2px dashed #bfe9ff;outline-offset:2px}
.av.frz::after{content:"❄";position:absolute;right:-6px;bottom:-6px;font-size:13px;color:#bfe9ff;opacity:1}
.bar{height:8px;border-radius:99px;background:var(--well);box-shadow:inset 2px 2px 4px rgba(0,0,0,.5);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--x);box-shadow:0 0 8px var(--x);transition:width .6s}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--well);color:var(--x,var(--mut))}
.tag.frz{color:#bfe9ff;background:rgba(126,200,240,.14)}
.go{font-size:13px;font-weight:700;border-radius:14px;padding:11px 14px;text-align:center;width:100%}
.go.p{background:var(--x,var(--adv));color:var(--ink);box-shadow:0 0 12px color-mix(in srgb,var(--x,var(--adv)) 30%,transparent)}
.go.g{color:var(--mut);background:var(--well);box-shadow:inset 2px 2px 6px rgba(0,0,0,.5),inset -1px -1px 4px rgba(255,255,255,.04)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;font-size:12.5px;color:var(--mut)}
.log div{display:flex;gap:8px}
.log i{width:8px;height:8px;border-radius:50%;background:var(--x);margin-top:6px;flex:none}
.hint{font-size:12.5px;color:var(--mut)}
.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;color:var(--dim)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
html.rg-nav-on .toast{bottom:auto!important} /* this page's toast sits at the top */
html.rg-nav-on:not(.rg-playing) .sheet{bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:calc(90% - 64px)} /* sheets sit above the bottom bar */
.sheet{position:fixed;left:50%;bottom:0;z-index:21;width:min(540px,100%);max-height:90%;overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;box-shadow:0 -10px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-top .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--play);color:#fff;background:radial-gradient(circle at 35% 30%,#a7acb4,#565b63);border:4px solid var(--x);flex:none;text-shadow:0 1px 2px #000}
.sh-top .t{flex:1;min-width:0}
.sh-top .t b{display:block;font:600 20px var(--play)}
.sh-top .t small{color:var(--mut)}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.info{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.info b{color:var(--fg);font-weight:600}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;font-weight:700}
.vs span{font-size:12px;color:var(--dim)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pbtn{border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;background:var(--raise);box-shadow:var(--raise-sh)}
.pbtn small{font-size:11px;color:var(--mut);font-weight:500}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.crownrow{display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 10px}
.crownrow b{flex:1}
.crownrow .go{width:auto;padding:8px 14px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;padding:9px 16px;border-radius:99px;font-size:13px;background:var(--toast);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:60;transition:opacity .35s,transform .35s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
.win{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.win .big{font:700 30px var(--play)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
/* game arena (full screen over the map) */
[hidden]{display:none!important}
.arena{position:fixed;inset:0;z-index:50;background:#16181d;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));touch-action:none;user-select:none;-webkit-user-select:none}
.ar-top{display:flex;align-items:center;gap:12px;font:600 18px var(--play)}
.ar-top .sc{display:flex;align-items:center;gap:10px;min-width:0}
.ar-top .sc b{font-size:30px;color:var(--fg);min-width:26px;text-align:center}
.ar-top .mid{flex:1;text-align:center;color:var(--mut);font:500 13px var(--font)}
.ar-help{text-align:center;color:var(--dim);font-size:12.5px}
.arena canvas{flex:1;min-height:0;width:100%;border-radius:22px;display:block}
.ar-over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,16,.72);z-index:2}
.ar-box{background:var(--sheet);border-radius:26px;padding:22px;width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.ar-box .big{font:700 30px var(--play)}
.ch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.ch .clock{font:700 clamp(40px,9vh,64px) var(--play);color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.ch .card{background:#fff;color:#15181e;border-radius:28px;width:min(640px,100%);min-height:min(220px,30vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;box-shadow:0 10px 0 #c9cfd8,0 20px 40px rgba(0,0,0,.4)}
.ch .card small{font:700 13px var(--font);letter-spacing:.12em;text-transform:uppercase;color:#6b7383}
.ch .card b{font:700 clamp(34px,7vw,64px)/1.05 var(--play);text-wrap:balance}
.ch .acts{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;width:min(640px,100%)}
.ch .acts .go{padding:20px;font-size:18px;border-radius:20px}
.ch .tally{display:flex;gap:28px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.ch .card.pop{animation:pop .25s ease}@keyframes pop{50%{transform:scale(.95)}}}
/* new grand game setup */
a.go{display:block;text-decoration:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.su{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.su{grid-template-columns:1fr}}
.su-box{border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--x)}
.su-box.out{grid-column:1/-1}
.in{width:100%;padding:10px 12px;border-radius:12px;border:0;background:var(--sheet);color:var(--x,var(--fg));font:600 16px var(--play);box-shadow:var(--well-sh)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border-radius:99px;background:var(--raise);box-shadow:var(--raise-sh);font-weight:600;font-size:13px;min-height:40px}
.chip.on{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(255,224,138,.35)}
/* games on the map iPad */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(640px,100%)}
.opt{padding:14px 10px;border-radius:18px;font:600 clamp(15px,2.2vw,19px)/1.2 var(--play);background:var(--raise);box-shadow:var(--raise-sh);text-align:center;min-height:60px;transition:background .15s}
.opt.ok{background:#2e7d4f;color:#fff}.opt.no{background:#8a2d33;color:#fff}
.tq{border-radius:22px;padding:14px 18px;text-align:center;font:600 clamp(18px,2.6vw,26px)/1.25 var(--play);text-wrap:balance}
.tb{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.duo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-aspect-ratio:1/1){.duo{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.tbs{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;justify-content:center;background:color-mix(in srgb,var(--x) 12%,#202328);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--x) 45%,transparent);transition:opacity .2s}
.tbs>span{font:600 17px var(--play);color:var(--x);text-align:center}
.tbs .opts{width:100%}
.tbs.lock{opacity:.4}
.half{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:color-mix(in srgb,var(--x) 14%,#202328);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--x) 50%,transparent);font:600 20px var(--play);text-align:center;padding:12px;touch-action:none;cursor:pointer;min-height:0;transition:background .12s}
.half b{font:700 clamp(44px,10vw,96px)/1 var(--play);color:var(--x)}
.half small{font:600 16px var(--font);color:var(--mut)}
.half .bar{width:min(320px,90%);height:14px}
.half.wait{background:#4a1f24}.half.fire{background:#1f6b3e}.half.fire small{color:#fff}
.pad{flex:1;width:100%;border-radius:26px;display:grid;place-items:center;font:700 clamp(36px,8vw,72px) var(--play);text-align:center;touch-action:none;color:#fff}
.pad.wait{background:#5a2328}.pad.fire{background:#1f8a4c}.pad.done{background:var(--well);color:var(--fg);font-size:clamp(26px,5vw,44px)}
.ch .big{font:700 clamp(24px,4vw,36px)/1.15 var(--play)}
.rlist{display:flex;flex-direction:column;gap:6px;width:min(420px,100%);max-height:45vh;overflow-y:auto}
.rlist div{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:14px;background:var(--well);text-align:left}
.rlist div b{flex:1}.rlist div.out{opacity:.45;text-decoration:line-through}
.mmw{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.mm{display:grid;gap:8px;grid-template-columns:repeat(4,var(--s,70px));grid-auto-rows:var(--s,70px)}
.mm button{border-radius:14px;background:var(--raise);box-shadow:var(--raise-sh);font-size:calc(var(--s,70px)*.5);display:grid;place-items:center;text-align:center;color:var(--dim);line-height:1}
.mm button.up{background:#fff}.mm button.got{background:#cfeedd;opacity:.75}
.pic-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.pic-bar .clk{font:700 34px var(--play);color:var(--gold);font-variant-numeric:tabular-nums;min-width:64px}
.pic-bar .tally{font-weight:700;color:var(--mut)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--x);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sw.on{outline:3px solid #fff;outline-offset:2px}
.tools .go{width:auto;padding:8px 14px}
#pc{background:#fff;touch-action:none}
.acts2{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.acts2 .go{padding:16px;font-size:17px;border-radius:18px}
.ban{display:flex;flex-direction:column;gap:2px;font:600 clamp(16px,2.4vw,20px) var(--font);color:#b3262c;margin-top:6px}
.ban span::before{content:"✕ ";opacity:.6}
@media (max-width:640px){.ar-top{flex-wrap:wrap;row-gap:4px}.ar-top #arQuit{margin-left:auto}.ar-top .mid{order:3;flex-basis:100%}.ar-top .sc b{font-size:24px}}
.places{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.plrow{display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 12px;flex-wrap:wrap}
.plrow .pl{font:700 18px var(--play);color:var(--gold);width:36px;flex:none}
.plrow .nm{flex:1;min-width:0;font-weight:600}
.plrow small{color:var(--mut);width:100%;padding-left:46px}
/* online: lobby rows, rooms list, watch screen */
.lrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.lrow b{font-weight:600}
.lrow .st{margin-left:auto;font-weight:700;font-size:13px;color:var(--mut)}
.lrow .st.ok{color:#7be08a}
.lbteam{border-left:4px solid var(--x);padding-left:10px;margin-top:10px}
.lbteam .lab{color:var(--x)}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--raise);box-shadow:var(--raise-sh);margin-top:8px}
.rrow span{flex:1;min-width:0}.rrow small{display:block;color:var(--mut)}.rrow em{font-style:normal;font-weight:700;color:var(--teal)}
.go.sm{padding:9px 12px;font-size:14px;margin-top:10px}
.live-note{border-radius:14px;padding:10px 12px;background:rgba(255,210,63,.12);color:#ffe9a6;font-weight:600}
body.watch #newMap,body.watch #watchLink{display:none}
body.watch .cols{grid-template-columns:minmax(0,1fr) 360px}
body.watch .top h1{font-size:30px}
@media (max-width:640px){.top h1{flex-basis:100%}}
</style>

<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <h1>The Road to the Crown <small>Reach the castle, win the final, and one player is crowned King or Queen</small></h1>
    <a class="pill raise" id="watchLink" href="map.html?watch=1" title="Show the live map on a shared screen (the iPad)">📺 Watch screen</a><button class="pill raise" id="newMap">Start a new game</button>
  </div>
  <div class="cols">
    <div class="mapbox well">
      <svg id="map" viewBox="0 0 1000 640" role="img" aria-label="Kingdom map from the village to the castle"></svg>
      <div class="legend">
        <span><i style="--x:#ffffff"></i>Game stop</span>
        <span><i style="--x:#e5484d"></i>Challenge (team vs team)</span>
        <span><i style="--x:#f5b300"></i>Showdown (elimination)</span>
        <span><i style="--x:#8e5cf7"></i>Surprise event</span>
        <span><i style="--x:#2ec4b6"></i>Mind game (harder near the castle)</span>
        <span><i style="--x:#e0459b"></i>Royal vote (freeze a player)</span>
      </div>
    </div>
    <div class="side" id="side"></div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<div class="arena" id="arena" hidden></div>

<script src="mind.js"></script>
<script src="rg.js?v=10"></script>
<script>

function watchHint(){const t=cur(),L=S.live;

// ---------- moves ----------
function moveTo(t,id){t.hist.push(t.at);t.at=id}
function back(t){if(t.hist.length)t.at=t.hist.pop()}
function stepForward(t,n){for(let i=0;i<n;i++){const nx=N[t.at].next.filter(x=>x!=="S"&&N[x].type!=="vote");if(!nx.length)break;nx.sort((a,b)=>dist(a)-dist(b));moveTo(t,nx[0])}}
function freeze(t){if(t.powers.includes("shield")){t.powers.splice(t.powers.indexOf("shield"),1);toast(t.name+"'s Shield blocked the freeze");log(t.name+" raised a Shield and stayed unfrozen",t.x);return}t.frozen=1}
function maybePower(t){const o=S.teams.find(x=>x!==t);if(dist(t.at)>dist(o.at)&&t.powers.length<2){const k=pick(["shield","steal","double"]);t.powers.push(k);toast(t.name+" earned a power-up: "+POWERS[k].t+" ("+POWERS[k].d.toLowerCase()+")");log(t.name+" earned "+POWERS[k].t+" for being behind",t.x)}}
function won(t){if(t.powers.includes("double")){t.powers.splice(t.powers.indexOf("double"),1);S.free=true;toast("Double! Take a free extra step")}}
function endTurn(){S.live=null;if(S.free){render();return}
  const t=cur();t.ids.forEach(id=>{if(S.frozenP[id]==="next")return;if(S.frozenP[id])delete S.frozenP[id]});t.ids.forEach(id=>{if(S.frozenP[id]==="next")S.frozenP[id]=1});
  S.turn=1-S.turn;const n=cur();n.ids.forEach(id=>{if(S.frozenP[id]==="next")S.frozenP[id]=1});render()}

// ---------- sheets ----------

const avBtn=(id,attr,dis,note)=>`<button class="pbtn" ${attr} ${dis?"disabled":""}>${avH(id)}${esc(pp(id).name)}<small>${esc(note||teamOf(id).name)}</small></button>`;

function randomTeams(){let ids=Object.keys(SU.g).filter(id=>SU.g[id]!==-1&&RG.canPlay("crown",id));if(!ids.length)ids=Object.keys(SU.g);const f=Math.random()<.5?0:1;shuffle(ids).forEach((id,i)=>SU.g[id]=(i+f)%2)}

let pend;
function stop(id){if(!canAct())return;const n=N[id],t=cur(),o=other(),ty=n.mind?MINDT:TYPE[n.type];pend=id;claim(id);

  const head=(k,lock)=>`<div class="sh-top"><span class="ic" style="--x:${ty.c}">${id==="S"?"♛":ORDER[id]}</span><span class="t"><b>${esc(n.name)}</b><small>${k}</small></span>${lock?"":X}</div>`;

  const sitting=t.ids.filter(i=>S.frozenP[i]).map(i=>pp(i).name);const sitNote=sitting.length?`<p class="hint" style="margin:0;color:#bfe9ff">${esc(sitting.join(" and "))} ${sitting.length>1?"are":"is"} frozen and can't play this one.</p>`:"";
  if(n.type==="event"){moveTo(t,id);const e=EVENTS[n.ev];if(n.ev==="tail")stepForward(t,1);else freeze(t);log(t.name+": "+e.t+" at "+n.name,t.x);

      <span class="lab">Who got the most votes?</span><div class="pgrid">${everyone().map(p=>{const last=teamOf(p).ids.every(i=>i===p||S.frozenP[i]);return avBtn(p,`data-vote="${esc(p)}"`,S.frozenP[p]||last,S.frozenP[p]?"Frozen":last?"Last one in":"")}).join("")}</div>`,1);return}
  if(n.type==="game")open(head("Game stop")+dev+sitNote+`<p class="hint" style="margin:0">${esc(t.name)} plays. Win to move onto this stop, lose to stay put.</p>${playBtn(n)}${byHand(n)?`<div class="row2"><button class="go g" data-res="win">We won</button><button class="go g" data-res="lose">We lost</button></div>`:""}`);
  if(n.type==="chal")open(head("Challenge · shorter road, higher risk")+dev+sitNote+`<div class="vs"><span style="color:${t.x}">${esc(t.name)}</span><span>VS</span><span style="color:${o.x}">${esc(o.name)}</span></div><p class="hint" style="margin:0">Winner moves forward. Loser's whole team freezes for one turn.</p>${playBtn(n)}${byHand(n)?`<div class="row2"><button class="go g" data-res="cw">${esc(t.name)} won</button><button class="go g" data-res="cl">${esc(o.name)} won</button></div>`:""}`);
  if(n.type==="show")open(head("Showdown · everyone plays")+dev+`<p class="hint" style="margin:0">All ${everyone().length} players play an elimination game. The last one standing earns their team 2 steps.</p>${playBtn(n)}${byHand(n)?`<span class="lab">Who was the last one standing?</span><div class="pgrid">${everyone().map(p=>avBtn(p,`data-surv="${esc(p)}"`)).join("")}</div>`:""}`);

function result(r,left){const id=pend,n=N[id],t=cur(),o=other();shut();left=Math.max(0,left|0);
  if(left&&(r==="win"||r==="fw"))t.tp+=left;else left=0;
  if(r==="win"){moveTo(t,id);log(t.name+" won "+n.g[0]+" at "+n.name+tpTxt(left),t.x);won(t)}
  else if(r==="lose"){log(t.name+" lost "+n.g[0]+" at "+n.name,t.x);maybePower(t)}
  else if(r==="cw"){moveTo(t,id);freeze(o);log(t.name+" beat "+o.name+" at "+n.g[0]+"; "+o.name+" froze",t.x);won(t)}
  else if(r==="cl"){freeze(t);stepForward(o,1);log(o.name+" won the "+n.g[0]+" challenge and moved ahead; "+t.name+" froze",o.x);maybePower(t)}
  else if(r==="fw"){moveTo(t,id);log(t.name+" won "+n.g[0]+" and stormed the castle!"+tpTxt(left),t.x);S.live=null;render();duel=[];crownSheet(t);return}
  else if(r==="fl"){back(t);log(t.name+" lost at the castle gates and fell back",t.x);maybePower(t)}
  endTurn()}
function survive(p){const w=teamOf(p),t=cur();shut();moveTo(t,pend);stepForward(w,2);log("Showdown at "+N[pend].name+": "+pp(p).name+" survived, "+w.name+" jumped 2 stops",w.x);endTurn()}

// the throne duel: two players of the winning team, Tap Race on this iPad or a Mind race on phones; then the host crowns the winner
let duel=[],duelWin=null;
function crownSheet(t,keep){t=t||S.teams.find(x=>x.at==="S");if(!t)return;
  const many=t.ids.length>1,rows=!many?t.ids:duelWin&&t.ids.includes(duelWin)?[duelWin]:duel.length===2?duel:[]; // only a duelist can be crowned (the winner, once the Tap Race is played)
  open(`<div class="sh-top"><span class="ic" style="--x:#f5b300">♛</span><span class="t"><b>Throne duel</b><small>${esc(t.name)} holds the castle. ${many?"One last 1v1 game between its players decides who wears the crown.":"Its only player wears the crown."}</small></span></div>
  ${many?`<div class="info well"><span><b>Pick two duelists</b> · ${duel.length}/2 picked</span><div class="chips">${t.ids.map(id=>`<button class="chip${duel.includes(id)?" on":""}" data-duel="${esc(id)}">${avH(id,32)}${esc(pp(id).name)}</button>`).join("")}</div></div>
  <div class="row2"><button class="go p" id="duelGo" style="--x:#ffd23f" ${duel.length===2?"":"disabled"}>Tap Race on this phone</button><a class="go g" target="_blank" rel="noopener" href="play.html?new=race&amp;score=0&amp;players=${encodeURIComponent((duel.length===2?duel:t.ids).join(","))}&amp;mind=${pick(MindGames.list).id}&amp;level=5">Mind race on phones</a></div>`:""}
  <span class="lab">Crown the winner</span>${many&&!rows.length?`<p class="hint" style="margin:0">Pick two duelists and play the duel first. Then crown whoever won it.</p>`:""}${many&&!duelWin&&rows.length?`<p class="hint" style="margin:0">Played the Mind race on phones? Crown whoever won it.</p>`:""}${rows.map(id=>`<div class="crownrow well">${avH(id)}<b>${esc(pp(id).name)}${id===duelWin?' <span class="tag" style="--x:var(--gold)">Won the duel</span>':""}</b><button class="go p" style="--x:#f5b300" data-crown="${esc(id)},King">King</button><button class="go p" style="--x:#f7b8d2" data-crown="${esc(id)},Queen">Queen</button></div>`).join("")}`,1,keep)}
function crown(id,title){const t=teamOf(id);S.over=`Long live ${title} ${pp(id).name}! ${t.name} took the castle.`;S.crowned={id,title};S.live=null;duel=[];duelWin=null;
  log(pp(id).name+" was crowned "+title,t.x);const P=places();push({final:P.order.map((x,i)=>({id:x,place:P.places[i],bonus:bonusOf(teamOf(x))}))});render();burst();summed=1;summary()}
function places(){const id=S.crowned.id,t=teamOf(id),o=S.teams.find(x=>x!==t),rest=t.ids.filter(x=>x!==id);
  return {t,o,order:[id,...rest,...o.ids],places:[1,...rest.map(()=>2),...o.ids.map(()=>3)]}}
// time points: 1 bonus coin each per N points (Admin > Settings, usually 10), at most BONUS_MAX per game so the crown still matters most
const BONUS_MAX=3,bonusPer=()=>ROOM&&ROOM.bonus_per!=null?+ROOM.bonus_per:10;
const bonusOf=t=>{const per=bonusPer();return per>0?Math.min(BONUS_MAX,Math.floor((t.tp|0)/per)):0};
function feeNote(){const f=(ROOM&&ROOM.fees)||{},ids=Object.keys(f).filter(k=>f[k]>0&&S&&everyone().includes(k));return ids.length?`<p class="hint" style="margin:0">Paid for player swaps: ${ids.map(k=>`${esc(pp(k).name)} −${f[k]}`).join(", ")} coins.</p>`:""}

let loop=null,cleanup=null,onQuit=null;

const arTop=(mid,t)=>{t=t||cur();return `<div class="ar-top"><span class="sc" style="color:${t.x}">${esc(t.name)}</span><span class="mid">${mid}</span>${QUIT}</div>`};

function openArena(h){const A=$("arena");A.innerHTML=h;A.hidden=false;navSync()}
function closeArena(){if(loop)cancelAnimationFrame(loop);loop=null;if(cleanup)cleanup();cleanup=null;onQuit=null;$("arena").hidden=true;$("arena").innerHTML="";navSync()}
// res: win:<seconds left> · lose · cw · cl · fw:<seconds left> · fl · surv:<id> · duel:<id>
function arenaOver(title,color,text,res,label){const d=document.createElement("div");d.className="ar-over";
  d.innerHTML=`<div class="ar-box"><div class="big" style="color:${color}">${esc(title)}</div><p class="hint" style="margin:0">${text}</p><button class="go p" style="--x:${color}" data-arres="${esc(res)}">${label||"Back to the map"}</button></div>`;$("arena").appendChild(d);
  if(/^(win|cw|fw|surv|duel)/.test(res))burst()}
const leftNote=l=>l>0?` <b style="color:var(--gold)">${l} second${l===1?"":"s"} left: +${l} time points.</b>`:"";
// a timer that counts down once a second; stops by itself at 0
function clock(sec,tick,end){let left=sec;const id=setInterval(()=>{left--;tick(left);if(left<=0){clearInterval(id);end()}},1000);return {stop:()=>clearInterval(id),get left(){return left},cut(s){left=Math.max(1,left-s);tick(left)}}}

// mind games (mind.js): stop games, the castle gate and the Thaw
function mindPlay(o){const t=cur();let left=0;
  openArena(arTop(o.mid)+`<div id="mgHost" style="flex:1;display:flex;min-height:0"></div>`);
  const g=MindGames.play($("mgHost"),{game:o.game,level:o.level,team:t.name,color:t.x,doneLabel:"Back to the map",
    onFinish:f=>{left=f.win?f.left|0:0;if(left)setTimeout(()=>{const p=document.querySelector("#mgHost .mg-end p");if(p)p.insertAdjacentHTML("beforeend",leftNote(left))},0)},
    onDone:win=>{closeArena();o.end(win,win?left:0)}});
  cleanup=()=>g.stop()}
function mindStop(n){const fin=n.type==="castle";
  mindPlay({game:fin?pick(MindGames.list).id:n.mind,level:fin?5:lvl(pend),mid:fin?"Mind Gauntlet · the castle gate":esc(n.g[0])+" · "+esc(n.name),end:(win,l)=>result(win?(fin?"fw":"win"):(fin?"fl":"lose"),l)})}
function thaw(){mindPlay({game:pick(MindGames.list).id,level:1,mid:"Thaw game · win to play this turn",end:(win,l)=>{const t=cur();t.frozen=0;
  if(win){log(t.name+" won the Thaw and is back in",t.x);S.live=null;render();toast(t.name+" thawed out. Tap a glowing stop")}else{log(t.name+" lost the Thaw and sat out a frozen turn",t.x);endTurn()}}})}

// word card games: one player holds the iPad, the team guesses against the clock
function cardGame(n,c){const t=cur(),deck=MindGames.deck(c.key,c.deck);let got=0,skip=0,tm=null,gone=false;
  openArena(arTop(`${c.name} · ${esc(n.name)}`)+`<div class="ch"><div class="card"><small>How to play</small><b>${c.title}</b><p class="hint" style="margin:0;color:#4a5160;max-width:46ch">${c.how} Get <b style="font:inherit;color:#15181e">${c.need} words in ${c.time} seconds</b> to win this stop. Seconds left count as time points.</p></div>
    <div class="acts" style="grid-template-columns:1fr"><button class="go p" id="chGo" style="--x:${t.x}">${c.start}</button></div></div>`);
  const box=()=>$("arena").querySelector(".ch");
  const go=()=>{let k=3;const cd=()=>{if(gone)return;if(k===0){play();return}box().innerHTML=`<div class="clock">${k--}</div><p class="hint">Get ready...</p>`;setTimeout(cd,700)};cd()};
  const play=()=>{box().innerHTML=`<div class="clock" id="chT">${c.time}</div><div class="card" id="chC"></div><div class="acts"><button class="go g" id="chS">${c.skip||"Skip"}</button><button class="go p" id="chY" style="--x:#5fc46a">Got it!</button></div><div class="tally"><span id="chG">Correct: 0 / ${c.need}</span><span id="chK">Skipped: 0</span></div>`;
    show();tm=clock(c.time,l=>{$("chT")&&($("chT").textContent=l)},end)};
  const show=()=>{const w=deck.next(),el=$("chC");el.innerHTML=c.card(w);el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")};
  const end=()=>{if(gone)return;gone=true;tm&&tm.stop();const w=got>=c.need,l=w?tm.left:0;arenaOver(w?"You did it!":"Time's up",w?"#5fc46a":"#ff8f8f",`${esc(t.name)} got ${got} word${got===1?"":"s"}${w?` and moves onto ${esc(n.name)}.`+leftNote(l):`. You needed ${c.need}, so you stay where you are.`}`,w?"win:"+l:"lose")};
  const onClick=e=>{const b=e.target.closest("button");if(!b||gone)return;if(b.id==="chGo")go();else if(b.id==="chY"){got++;$("chG").textContent=`Correct: ${got} / ${c.need}`;if(got>=c.need){end();return}show()}else if(b.id==="chS"){skip++;$("chK").textContent="Skipped: "+skip;show()}};
  $("arena").addEventListener("click",onClick);
  cleanup=()=>{gone=true;tm&&tm.stop();$("arena").removeEventListener("click",onClick)}}
function charades(n){cardGame(n,{name:"Charades",key:"charades",title:"Act it out!",need:5,time:60,deck:WORDS,start:"I'm the actor, start!",how:`One actor holds the phone so only they see the word and acts it out with no talking. ${esc(cur().name)} guesses.`,card:w=>`<small>${w[0]}</small><b>${esc(w[1])}</b>`})}
function headsUp(n){cardGame(n,{name:"Heads Up",key:"headsup",title:"Guess who or what!",need:5,time:60,deck:HEADS,start:"I'm the guesser, start!",skip:"Pass",how:`The guesser holds the phone up on their forehead, screen facing the team, and must not peek. The team gives clues without saying the word and taps Got it or Pass.`,card:w=>`<small>${w[0]}</small><b>${esc(w[1])}</b>`})}
function taboo(n){cardGame(n,{name:"Taboo",key:"taboo",title:"Describe it, don't say it!",need:4,time:75,deck:TABOO,start:"I'm the clue giver, start!",skip:"Buzz! Skip it",how:`One clue giver holds the phone and describes the word without saying it or any of the blocked words under it. ${esc(cur().name)} guesses. Said a blocked word? Tap Buzz to skip.`,card:w=>`<small>Get them to say</small><b>${esc(w[0])}</b><div class="ban">${w[1].map(x=>`<span>${esc(x)}</span>`).join("")}</div>`})}

// Pictionary: the drawer peeks at the word, draws, the team guesses
function pictionary(n){const t=cur(),NEED=3,TIME=120,COLS=["#15181e","#e5484d","#3b6fa0","#2e8b57","#f5b300"];const deck=MindGames.deck("pictionary",PICT);let word=deck.next(),got=0,tm=null,gone=false,col=COLS[0],last=null;
  openArena(arTop(`Pictionary · ${esc(n.name)}`)+`<div class="pic-bar"><span class="clk" id="pcT">${TIME}</span><span class="tally" id="pcG">Guessed: 0 / ${NEED}</span><div class="tools">${COLS.map((c,k)=>`<button class="sw${k?"":" on"}" data-col="${c}" style="--x:${c}" aria-label="Pen color"></button>`).join("")}<button class="sw" data-col="erase" style="--x:#fff" aria-label="Eraser"></button><button class="go g" id="pcClr">Clear</button></div></div>
    <canvas id="pc"></canvas><div class="acts2"><button class="go g" id="pcS">Skip word</button><button class="go p" id="pcY" style="--x:#5fc46a">They got it!</button></div>`);
  const cv=$("pc"),ctx=cv.getContext("2d");
  const size=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1,old=document.createElement("canvas");old.width=cv.width;old.height=cv.height;if(cv.width)old.getContext("2d").drawImage(cv,0,0);
    cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);if(old.width>1)ctx.drawImage(old,0,0,old.width/d,old.height/d)};
  const clear=()=>{const r=cv.getBoundingClientRect();ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height)};
  size();addEventListener("resize",size);
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const line=(a,b)=>{ctx.strokeStyle=col==="erase"?"#fff":col;ctx.lineWidth=col==="erase"?28:6;ctx.lineCap=ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0]+.01,b[1]);ctx.stroke()};
  cv.addEventListener("pointerdown",e=>{last=pt(e);line(last,last);cv.setPointerCapture&&cv.setPointerCapture(e.pointerId)});
  cv.addEventListener("pointermove",e=>{if(!last)return;const p=pt(e);line(last,p);last=p});
  const up=()=>last=null;cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  const over=h=>{const o=$("pcO");if(o)o.remove();if(!h)return;const d=document.createElement("div");d.className="ar-over";d.id="pcO";d.innerHTML=`<div class="ar-box">${h}</div>`;$("arena").appendChild(d)};
  const peek=()=>over(`<span class="lab">${got?"Next word":"Drawer only"}</span><div class="big">Only the drawer looks!</div><p class="hint" style="margin:0">Everyone else, look away.</p><button class="go p" id="pcShow" style="--x:${t.x}">Show me the word</button>`);
  over(`<span class="lab">How to play</span><div class="big">Draw it!</div><p class="hint" style="margin:0">One drawer sees the word and draws it. No letters or numbers! ${esc(t.name)} guesses out loud. Get <b>${NEED} words in ${TIME} seconds</b> to win. Seconds left count as time points.</p><button class="go p" id="pcGo" style="--x:${t.x}">I'm the drawer</button>`);
  const end=()=>{if(gone)return;gone=true;tm&&tm.stop();over();const w=got>=NEED,l=w?tm.left:0;arenaOver(w?"You did it!":"Time's up",w?"#5fc46a":"#ff8f8f",`${esc(t.name)} guessed ${got} drawing${got===1?"":"s"}${w?` and moves onto ${esc(n.name)}.`+leftNote(l):`. You needed ${NEED}, so you stay where you are.`}`,w?"win:"+l:"lose")};
  const onClick=e=>{const b=e.target.closest("button");if(!b||gone)return;
    if(b.id==="pcGo")peek();
    else if(b.id==="pcShow")over(`<span class="lab">Your word</span><div class="big" style="color:var(--gold)">${esc(word)}</div><button class="go p" id="pcDraw" style="--x:${t.x}">Hide it and start drawing</button>`);
    else if(b.id==="pcDraw"){over();clear();if(!tm)tm=clock(TIME,l=>{$("pcT")&&($("pcT").textContent=l)},end)}
    else if(b.id==="pcClr")clear();
    else if(b.dataset.col){col=b.dataset.col;$("arena").querySelectorAll(".sw").forEach(s=>s.classList.toggle("on",s===b))}
    else if(b.id==="pcY"&&tm){got++;word=deck.next();$("pcG").textContent=`Guessed: ${got} / ${NEED}`;if(got>=NEED)end();else peek()}
    else if(b.id==="pcS"&&tm){word=deck.next();peek()}};
  $("arena").addEventListener("click",onClick);
  cleanup=()=>{gone=true;tm&&tm.stop();removeEventListener("resize",size);$("arena").removeEventListener("click",onClick)}}

// Memory Match: the team takes turns flipping two cards
function memoryMatch(n){const t=cur(),TIME=90,PAIRS=8;let tm=null,up=[],got=0,busy=false,gone=false,moves=0;
  const pk=MindGames.deck("memory",ICONS),ic=[...Array(PAIRS)].map(()=>pk.next()),deck=shuffle(ic.concat(ic));
  openArena(arTop(`Memory Match · ${esc(n.name)}`)+`<div class="ch"><div class="card"><small>How to play</small><b>Find the pairs!</b><p class="hint" style="margin:0;color:#4a5160;max-width:46ch">Take turns: each player flips two cards. A pair stays open. Find all <b style="font:inherit;color:#15181e">${PAIRS} pairs in ${TIME} seconds</b> to win. Seconds left count as time points.</p></div><div class="acts" style="grid-template-columns:1fr"><button class="go p" id="mmGo" style="--x:${t.x}">Start</button></div></div>`);
  const box=()=>$("arena").querySelector(".ch");
  const fit=()=>{const w=$("mmW");if(!w)return;const r=w.getBoundingClientRect(),s=Math.max(40,Math.floor(Math.min((r.width-24)/4,(r.height-24)/4,140)));$("mm").style.setProperty("--s",s+"px")};
  const end=()=>{if(gone)return;gone=true;tm&&tm.stop();const w=got>=PAIRS,l=w?tm.left:0;arenaOver(w?"All pairs found!":"Time's up",w?"#5fc46a":"#ff8f8f",`${esc(t.name)} found ${got} of ${PAIRS} pairs in ${moves} tries${w?` and moves onto ${esc(n.name)}.`+leftNote(l):`, so you stay where you are.`}`,w?"win:"+l:"lose")};
  const onClick=e=>{const b=e.target.closest("button");if(!b||gone)return;
    if(b.id==="mmGo"){box().innerHTML=`<div class="clock" id="mmT">${TIME}</div><div class="tally"><span id="mmG">Pairs: 0 / ${PAIRS}</span><span id="mmM">Tries: 0</span></div><div class="mmw" id="mmW"><div class="mm" id="mm">${deck.map((_,k)=>`<button data-k="${k}" aria-label="Card ${k+1}">?</button>`).join("")}</div></div>`;fit();
      tm=clock(TIME,l=>{$("mmT")&&($("mmT").textContent=l)},end);return}
    const k=b.dataset.k;if(k===undefined||busy||b.classList.contains("up")||b.classList.contains("got"))return;
    b.classList.add("up");b.textContent=deck[k];up.push(b);if(up.length<2)return;
    moves++;$("mmM").textContent="Tries: "+moves;const [a,c]=up;up=[];
    if(deck[a.dataset.k]===deck[c.dataset.k]){a.classList.add("got");c.classList.add("got");got++;$("mmG").textContent=`Pairs: ${got} / ${PAIRS}`;if(got>=PAIRS)setTimeout(end,350)}
    else{busy=true;setTimeout(()=>{if(gone)return;[a,c].forEach(x=>{x.classList.remove("up");x.textContent="?"});busy=false},750)}};
  $("arena").addEventListener("click",onClick);addEventListener("resize",fit);
  cleanup=()=>{gone=true;tm&&tm.stop();removeEventListener("resize",fit);$("arena").removeEventListener("click",onClick)}}

// Trivia Sprint: the team answers against the clock, a wrong answer costs 5 seconds
function triviaSprint(n){const t=cur(),NEED=6,TIME=75,qs=MindGames.deck("trivia",TRIVIA);let got=0,tm=null,gone=false,busy=false;
  openArena(arTop(`Trivia Sprint · ${esc(n.name)}`)+`<div class="ch"><div class="card"><small>How to play</small><b>Quick, answer!</b><p class="hint" style="margin:0;color:#4a5160;max-width:46ch">${esc(t.name)} answers together. Get <b style="font:inherit;color:#15181e">${NEED} right in ${TIME} seconds</b> to win. A wrong answer costs 5 seconds. Seconds left count as time points.</p></div><div class="acts" style="grid-template-columns:1fr"><button class="go p" id="tsGo" style="--x:${t.x}">Start</button></div></div>`);
  const box=()=>$("arena").querySelector(".ch");
  const ask=()=>{busy=false;const q=qs.next(),o=shuffle(q.slice(1));$("tsQ").textContent=q[0];$("tsO").innerHTML=o.map(a=>`<button class="opt" data-a="${a===q[1]?1:0}">${esc(a)}</button>`).join("")};
  const end=()=>{if(gone)return;gone=true;tm&&tm.stop();const w=got>=NEED,l=w?tm.left:0;arenaOver(w?"You did it!":"Time's up",w?"#5fc46a":"#ff8f8f",`${esc(t.name)} got ${got} right${w?` and moves onto ${esc(n.name)}.`+leftNote(l):`. You needed ${NEED}, so you stay where you are.`}`,w?"win:"+l:"lose")};
  const onClick=e=>{const b=e.target.closest("button");if(!b||gone)return;
    if(b.id==="tsGo"){box().innerHTML=`<div class="clock" id="tsT">${TIME}</div><div class="tq well" id="tsQ" style="width:min(640px,100%)"></div><div class="opts" id="tsO"></div><div class="tally"><span id="tsG">Right: 0 / ${NEED}</span></div>`;ask();tm=clock(TIME,l=>{$("tsT")&&($("tsT").textContent=l)},end);return}
    if(b.dataset.a===undefined||busy)return;busy=true;
    if(b.dataset.a==="1"){b.classList.add("ok");got++;$("tsG").textContent=`Right: ${got} / ${NEED}`;if(got>=NEED){end();return}setTimeout(()=>!gone&&ask(),550)}
    else{b.classList.add("no");$("tsO").querySelector('[data-a="1"]').classList.add("ok");tm.cut(5);setTimeout(()=>!gone&&ask(),1100)}};
  $("arena").addEventListener("click",onClick);
  cleanup=()=>{gone=true;tm&&tm.stop();$("arena").removeEventListener("click",onClick)}}

// Trivia Battle: both teams buzz in on their own side; first right answer scores, a wrong one locks your side out
function triviaBattle(n){const L=cur(),R=other(),GOAL=5,sc=[0,0],qs=MindGames.deck("trivia",TRIVIA);let lock=[0,0],busy=true,gone=false;
  openArena(duoTop(L,R,`Trivia Battle · first to ${GOAL} · ${esc(n.name)}`)+`<div class="tb"><div class="tq well" id="tbQ">Get ready...</div><div class="duo">${[L,R].map((t,i)=>`<div class="tbs" id="tbS${i}" style="--x:${t.x}"><span>${esc(t.name)}</span><div class="opts" id="tbO${i}"></div></div>`).join("")}</div></div><div class="ar-help">Each team taps answers on its own side. First right answer wins the point. A wrong answer locks your side out of that question.</div>`);
  let q,o;
  const ask=()=>{if(gone)return;q=qs.next();o=shuffle(q.slice(1));lock=[0,0];busy=false;$("tbQ").textContent=q[0];
    [0,1].forEach(i=>{$("tbS"+i).classList.remove("lock");$("tbO"+i).innerHTML=o.map(a=>`<button class="opt" data-a="${a===q[1]?1:0}">${esc(a)}</button>`).join("")})};
  const reveal=()=>[0,1].forEach(i=>$("tbO"+i).querySelector('[data-a="1"]').classList.add("ok"));
  const onDown=e=>{const b=e.target.closest(".opt");if(!b||busy||gone)return;const i=+b.closest(".tbs").id.slice(3);if(lock[i])return;
    if(b.dataset.a==="1"){busy=true;b.classList.add("ok");sc[i]++;$(i?"sR":"sL").textContent=sc[i];
      if(sc[i]>=GOAL){gone=true;const w=i?R:L,l=i?L:R;setTimeout(()=>arenaOver(w.name+" wins!",w.x,`${sc[0]} to ${sc[1]}. ${esc(w.name)} moves forward and ${esc(l.name)} freezes for a turn.`,i?"cl":"cw"),700);return}
      toast((i?R:L).name+" got it!");setTimeout(ask,1200)}
    else{b.classList.add("no");lock[i]=1;$("tbS"+i).classList.add("lock");if(lock[0]&&lock[1]){busy=true;reveal();setTimeout(ask,1600)}}};
  $("arena").addEventListener("pointerdown",onDown);setTimeout(ask,900);
  cleanup=()=>{gone=true;$("arena").removeEventListener("pointerdown",onDown)}}

// Tap Race: one player per side taps their half as fast as they can
function tapRace(A,B,mid,done){const GOAL=40,sc=[0,0];let live=false,gone=false;
  openArena(duoTop(A,B,mid)+`<div class="duo">${[A,B].map((t,i)=>`<div class="half" data-h="${i}" style="--x:${t.x}"><span>${esc(t.name)}</span><b id="h${i}">0</b><div class="bar"><i id="hb${i}" style="width:0%"></i></div><small id="hm${i}">Get ready...</small></div>`).join("")}</div><div class="ar-help">Tap your own side as fast as you can. First to ${GOAL} taps wins. On a laptop: A key for the left side, L key for the right.</div>`);
  const msg=m=>[0,1].forEach(i=>$("hm"+i).textContent=m);
  let k=3;const cd=()=>{if(gone)return;if(k===0){live=true;msg("GO! Tap tap tap!");return}msg(k--+"...");setTimeout(cd,700)};setTimeout(cd,400);
  const hit=i=>{if(!live||gone)return;sc[i]++;$("h"+i).textContent=sc[i];$("hb"+i).style.width=Math.min(100,100*sc[i]/GOAL)+"%";$(i?"sR":"sL").textContent=sc[i];
    if(sc[i]>=GOAL){gone=true;msg("");$("hm"+i).textContent="Winner!";setTimeout(()=>done(i,sc),500)}};
  const onDown=e=>{const h=e.target.closest(".half");if(h){e.preventDefault();hit(+h.dataset.h)}};
  const kd=e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==="a")hit(0);else if(k==="l")hit(1)};
  $("arena").addEventListener("pointerdown",onDown);addEventListener("keydown",kd);
  cleanup=()=>{gone=true;$("arena").removeEventListener("pointerdown",onDown);removeEventListener("keydown",kd)}}

// Quick Draw: wait for green, then tap your side first; first to 3 rounds
function quickDraw(n){const L=cur(),R=other(),GOAL=3,sc=[0,0];let st="",timer=null,gone=false;
  openArena(duoTop(L,R,`Quick Draw · first to ${GOAL} · ${esc(n.name)}`)+`<div class="duo">${[L,R].map((t,i)=>`<div class="half" data-h="${i}" style="--x:${t.x}"><span>${esc(t.name)}</span><b id="h${i}">0</b><small id="hm${i}">Get ready...</small></div>`).join("")}</div><div class="ar-help">One player from each team. Wait for green, then tap your side first. Tapping too soon gives the point away. On a laptop: A key for the left side, L key for the right.</div>`);
  const look=(cls,m)=>[0,1].forEach(i=>{const h=$("arena").querySelector(`.half[data-h="${i}"]`);h.classList.remove("wait","fire");if(cls)h.classList.add(cls);$("hm"+i).textContent=m});
  const round=()=>{if(gone)return;st="wait";look("wait","Wait for green...");timer=setTimeout(()=>{st="fire";look("fire","TAP!")},1500+Math.random()*2500)};
  const point=(i,why)=>{st="";clearTimeout(timer);sc[i]++;$("h"+i).textContent=sc[i];$(i?"sR":"sL").textContent=sc[i];look("",why);
    if(sc[i]>=GOAL){gone=true;const w=i?R:L,l=i?L:R;setTimeout(()=>arenaOver(w.name+" wins!",w.x,`${sc[0]} to ${sc[1]}. ${esc(w.name)} moves forward and ${esc(l.name)} freezes for a turn.`,i?"cl":"cw"),900)}else setTimeout(round,1600)};
  const hit=i=>{if(gone)return;const a=i?R:L,b=i?L:R;if(st==="wait")point(1-i,a.name+" tapped too soon! Point to "+b.name);else if(st==="fire")point(i,a.name+" was faster!")};
  const onDown=e=>{const h=e.target.closest(".half");if(h){e.preventDefault();hit(+h.dataset.h)}};
  const kd=e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==="a")hit(0);else if(k==="l")hit(1)};
  $("arena").addEventListener("pointerdown",onDown);addEventListener("keydown",kd);setTimeout(round,900);
  cleanup=()=>{gone=true;clearTimeout(timer);$("arena").removeEventListener("pointerdown",onDown);removeEventListener("keydown",kd)}}

// Last One Standing: pass the iPad; each round everyone taps once on green and the slowest half is out
function lastStanding(n){let alive=shuffle(everyone()),round=1,times={},qi=0,timer=null,green=0,st="",gone=false;
  openArena(arTop(`Last One Standing · ${esc(n.name)}`)+`<div class="ch"></div>`);
  const box=()=>$("arena").querySelector(".ch"),sec=ms=>ms===Infinity?"Too soon":(ms/1000).toFixed(3)+" s";
  const intro=()=>{box().innerHTML=`<div class="card"><small>How to play</small><b>Fastest finger wins</b><p class="hint" style="margin:0;color:#4a5160;max-width:46ch">Pass the phone around. When it's your go, tap the big pad as soon as it turns green. Tapping too soon counts as slowest. After each round the slowest half is out, until one player is left.</p></div><div class="acts" style="grid-template-columns:1fr"><button class="go p" id="lsGo" style="--x:#f5b300">Start round 1</button></div>`};
  const turn=()=>{if(gone)return;if(qi>=alive.length){endRound();return}const id=alive[qi],p=pp(id);st="";
    box().innerHTML=`<p class="hint">Round ${round} · ${alive.length} players left · turn ${qi+1} of ${alive.length}</p>${avH(id,72)}<div class="big">Pass the phone to ${esc(p.name)}</div><button class="go p" id="lsReady" style="--x:${esc(p.color)};max-width:360px">I'm ${esc(p.name)}, ready!</button>`};
  const pad=()=>{st="wait";box().innerHTML=`<button class="pad wait" id="lsPad">Wait for green...</button>`;timer=setTimeout(()=>{if(gone)return;st="fire";green=performance.now();const b=$("lsPad");b.className="pad fire";b.textContent="TAP!"},1200+Math.random()*2600)};
  const hit=()=>{if(st!=="wait"&&st!=="fire")return;const id=alive[qi];clearTimeout(timer);times[id]=st==="wait"?Infinity:performance.now()-green;st="shown";
    const b=$("lsPad");b.className="pad done";b.textContent=`${pp(id).name}: ${sec(times[id])}`;qi++;setTimeout(turn,1300)};
  const endRound=()=>{const sorted=alive.slice().sort((a,b)=>times[a]-times[b]),k=Math.max(1,Math.floor(alive.length/2)),out=new Set(sorted.slice(sorted.length-k));
    alive=sorted.filter(x=>!out.has(x));
    if(alive.length===1){const w=alive[0],tm=teamOf(w);box().innerHTML=`<div class="rlist">${sorted.map(x=>`<div class="${out.has(x)?"out":""}">${avH(x,28)}<b>${esc(pp(x).name)}</b><span>${sec(times[x])}</span></div>`).join("")}</div>`;gone=true;
      setTimeout(()=>arenaOver(pp(w).name+" is the last one standing!",tm.x,`${esc(tm.name)} jumps 2 stops.`,"surv:"+w),600);return}
    box().innerHTML=`<div class="big">Round ${round} results</div><div class="rlist">${sorted.map(x=>`<div class="${out.has(x)?"out":""}">${avH(x,28)}<b>${esc(pp(x).name)}</b><span>${sec(times[x])}${out.has(x)?" · out":""}</span></div>`).join("")}</div><button class="go p" id="lsGo" style="--x:#f5b300;max-width:360px">Start round ${round+1}</button>`;round++};
  const onClick=e=>{const b=e.target.closest("button");if(!b||gone)return;if(b.id==="lsGo"){qi=0;times={};alive=shuffle(alive);turn()}else if(b.id==="lsReady")pad()};
  const onDown=e=>{if(e.target.closest("#lsPad")){e.preventDefault();hit()}};
  $("arena").addEventListener("click",onClick);$("arena").addEventListener("pointerdown",onDown);intro();
  cleanup=()=>{gone=true;clearTimeout(timer);$("arena").removeEventListener("click",onClick);$("arena").removeEventListener("pointerdown",onDown)}}

function airHockey(n){const L=cur(),R=other(),GOAL=3;
  openArena(duoTop(L,R,`Air Hockey · first to ${GOAL} wins · ${esc(n.name)}`)+`
   <canvas id="hc"></canvas><div class="ar-help">One player on each side drags their paddle. On a laptop: W A S D for the left player, arrow keys for the right.</div>`);
  const cv=$("hc"),ctx=cv.getContext("2d");let W,H,k,ox,oy;const T={w:2,h:1};
  function size(){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    k=Math.min(r.width/T.w,r.height/T.h)*.96;W=r.width;H=r.height;ox=(W-T.w*k)/2;oy=(H-T.h*k)/2}
  size();addEventListener("resize",size);
  const puck={x:1,y:.5,vx:0,vy:0,r:.035},P={L:{x:.3,y:.5,tx:.3,ty:.5,vx:0,vy:0,r:.065,c:L.x},R:{x:1.7,y:.5,tx:1.7,ty:.5,vx:0,vy:0,r:.065,c:R.x}};
  const sc={L:0,R:0},GH=.2,keys={};let pause=40,done=false;const ptr={};
  const toT=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left-ox)/k,(e.clientY-r.top-oy)/k]};
  const down=e=>{const [x,y]=toT(e);const side=x<1?"L":"R";ptr[e.pointerId]=side;P[side].tx=x;P[side].ty=y;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId)};
  const move=e=>{const s=ptr[e.pointerId];if(!s)return;const [x,y]=toT(e);P[s].tx=x;P[s].ty=y};
  const up=e=>{delete ptr[e.pointerId]};
  const kd=e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith("Arrow"))e.preventDefault()},ku=e=>{keys[e.key.toLowerCase()]=false};
  cv.addEventListener("pointerdown",down);cv.addEventListener("pointermove",move);cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  addEventListener("keydown",kd);addEventListener("keyup",ku);
  cleanup=()=>{removeEventListener("resize",size);removeEventListener("keydown",kd);removeEventListener("keyup",ku)};
  function serve(toward){puck.x=1+(toward==="L"?-.25:.25);puck.y=.5;puck.vx=0;puck.vy=0;pause=45}
  function step(){
    const sp=.022;
    if(keys.w)P.L.ty-=sp;if(keys.s)P.L.ty+=sp;if(keys.a)P.L.tx-=sp;if(keys.d)P.L.tx+=sp;
    if(keys.arrowup)P.R.ty-=sp;if(keys.arrowdown)P.R.ty+=sp;if(keys.arrowleft)P.R.tx-=sp;if(keys.arrowright)P.R.tx+=sp;
    for(const s of ["L","R"]){const p=P[s],lo=s==="L"?p.r:1+p.r,hi=s==="L"?1-p.r:2-p.r;
      p.tx=Math.max(lo,Math.min(hi,p.tx));p.ty=Math.max(p.r,Math.min(1-p.r,p.ty));
      const nx=p.x+(p.tx-p.x)*.55,ny=p.y+(p.ty-p.y)*.55;p.vx=nx-p.x;p.vy=ny-p.y;p.x=nx;p.y=ny}
    if(pause>0){pause--;return}
    const SUB=4;for(let i=0;i<SUB;i++){puck.x+=puck.vx/SUB;puck.y+=puck.vy/SUB;
      if(puck.y<puck.r){puck.y=puck.r;puck.vy=Math.abs(puck.vy)*.92}if(puck.y>1-puck.r){puck.y=1-puck.r;puck.vy=-Math.abs(puck.vy)*.92}
      const inGoal=Math.abs(puck.y-.5)<GH-puck.r*.3;
      if(!inGoal){if(puck.x<puck.r){puck.x=puck.r;puck.vx=Math.abs(puck.vx)*.92}if(puck.x>2-puck.r){puck.x=2-puck.r;puck.vx=-Math.abs(puck.vx)*.92}}
      if(puck.x<-puck.r){goal("R");return}if(puck.x>2+puck.r){goal("L");return}
      for(const s of ["L","R"]){const p=P[s],dx=puck.x-p.x,dy=puck.y-p.y,d=Math.hypot(dx,dy),m=p.r+puck.r;
        if(d<m&&d>0){const nx=dx/d,ny=dy/d;puck.x=p.x+nx*m;puck.y=p.y+ny*m;const rvx=puck.vx-p.vx,rvy=puck.vy-p.vy,vn=rvx*nx+rvy*ny;
          if(vn<0){puck.vx-=1.9*vn*nx;puck.vy-=1.9*vn*ny}puck.vx+=p.vx*.25;puck.vy+=p.vy*.25}}}
    const v=Math.hypot(puck.vx,puck.vy),MAX=.06;if(v>MAX){puck.vx*=MAX/v;puck.vy*=MAX/v}
    puck.vx*=.996;puck.vy*=.996}
  function goal(s){sc[s]++;$("s"+s).textContent=sc[s];toast((s==="L"?L:R).name+" scores!");
    if(sc[s]>=GOAL){done=true;const w=s==="L"?L:R;arenaOver(w.name+" wins!",w.x,`${sc.L} to ${sc.R}. ${esc(s==="L"?L.name+" moves forward and "+R.name+" freezes for a turn.":R.name+" moves ahead and "+L.name+" freezes for a turn.")}`,s==="L"?"cw":"cl")}
    else serve(s==="L"?"R":"L")}
  function X(x){return ox+x*k}function Y(y){return oy+y*k}
  function draw(){ctx.clearRect(0,0,W,H);
    // rink
    const rr=.08*k;ctx.fillStyle="#2b2f36";roundRect(X(-.03),Y(-.03),2.06*k,1.06*k,rr+6);ctx.fill();
    ctx.fillStyle="#eaf6ff";roundRect(X(0),Y(0),2*k,k,rr);ctx.fill();
    ctx.save();roundRect(X(0),Y(0),2*k,k,rr);ctx.clip();
    ctx.fillStyle=L.x+"33";ctx.fillRect(X(0),Y(0),k,k);ctx.fillStyle=R.x+"33";ctx.fillRect(X(1),Y(0),k,k);
    ctx.strokeStyle="#e5484d";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(X(1),Y(0));ctx.lineTo(X(1),Y(1));ctx.stroke();
    ctx.strokeStyle="#3b6fa0";ctx.lineWidth=3;ctx.beginPath();ctx.arc(X(1),Y(.5),.16*k,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(X(0),Y(.5),.25*k,-1.6,1.6);ctx.stroke();ctx.beginPath();ctx.arc(X(2),Y(.5),.25*k,1.55,4.72);ctx.stroke();ctx.restore();
    // goals
    ctx.fillStyle="#15181e";ctx.fillRect(X(-.03),Y(.5-GH),.03*k+2,2*GH*k);ctx.fillRect(X(2)-2,Y(.5-GH),.03*k+2,2*GH*k);
    // paddles + puck
    for(const s of ["L","R"]){const p=P[s];ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.arc(X(p.x)+3,Y(p.y)+5,p.r*k,0,7);ctx.fill();
      ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(X(p.x),Y(p.y),p.r*k,0,7);ctx.fill();ctx.strokeStyle="#15181e";ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.arc(X(p.x),Y(p.y),p.r*k*.45,0,7);ctx.fill()}
    ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.arc(X(puck.x)+2,Y(puck.y)+4,puck.r*k,0,7);ctx.fill();
    ctx.fillStyle="#15181e";ctx.beginPath();ctx.arc(X(puck.x),Y(puck.y),puck.r*k,0,7);ctx.fill();ctx.strokeStyle="#ffd23f";ctx.lineWidth=2;ctx.stroke()}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  serve(Math.random()<.5?"L":"R");
  (function f(){if(!done)step();draw();loop=requestAnimationFrame(f)})()}


// ---------- input ----------
$("map").addEventListener("click",e=>{const g=e.target.closest(".node.opt");if(g)stop(g.dataset.n)});
$("map").addEventListener("keydown",e=>{const g=e.target.closest(".node.opt");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();stop(g.dataset.n)}});
document.addEventListener("input",e=>{const i=e.target.closest("[data-tn]");if(i&&SU)SU.names[+i.dataset.tn]=i.value});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.shut!==undefined){shut();release()}
  else if(d.open){openRoom(+d.open)}
  else if(d.swap){SW=null;swapSheet()}
  else if(d.swo){SW.out=d.swo;swapSheet()}
  else if(d.swi){SW.inn=d.swi;swapSheet()}
  else if(b.id==="swGo")doSwap();
  else if(b.id==="lbJoin")act("room_join");
  else if(b.id==="lbReady")act("room_ready",{ready:!ROOM.ready.includes(meId())});
  else if(b.id==="lbStart")act("room_start");
  else if(b.id==="lbCancel"){if(confirm("Cancel this game for everyone?"))act("room_close")}
  else if(b.id==="lbLeave")act("room_leave").then(()=>openRoom(0));
  else if(d.done!==undefined){shut();endTurn()}
  else if(d.res)result(d.res,0);
  else if(d.vote){const p=d.vote,tm=teamOf(p);S.frozenP[p]=tm===cur()?"next":1;shut();log("Royal vote at "+N[pend].name+": "+pp(p).name+" is frozen for a turn","#e0459b");toast(pp(p).name+" was voted out and frozen for one turn");endTurn()}
  else if(d.surv)survive(d.surv);
  else if(d.crown){const i=d.crown.lastIndexOf(",");crown(d.crown.slice(0,i),d.crown.slice(i+1))}
  else if(d.mv){if(!RG.canPlay("crown",d.mv))return;const g=SU.g[d.mv];SU.g[d.mv]=g===0?1:g===1?-1:0;drawSetup()}
  else if(d.duel){const id=d.duel;duel=duel.includes(id)?duel.filter(x=>x!==id):duel.concat(id).slice(-2);crownSheet(null,true)}
  else if(d.demo!==undefined){const n=N[pend];if(n.g&&PLAY[n.g[0]]){shut();PLAY[n.g[0]](n);const id=pend;onQuit=()=>stop(id)}}
  else if(b.id==="arQuit"){const f=onQuit;closeArena();f&&f()}
  else if(d.arres){const r=d.arres,i=r.indexOf(":"),k=i<0?r:r.slice(0,i),v=i<0?"":r.slice(i+1);closeArena();
    if(k==="surv")survive(v);else if(k==="duel"){duelWin=v;crownSheet()}else result(k,+v||0)}
  else if(b.id==="suRand"){randomTeams();drawSetup()}
  else if(b.id==="suGo")sendInvites();
  else if(b.id==="duelGo"&&duel.length===2){const [a,c]=duel.map(id=>({name:pp(id).name,x:pp(id).color}));shut();
    tapRace(a,c,"Throne duel · Tap Race",i=>{const w=duel[i];arenaOver(pp(w).name+" wins the duel!","#ffd23f",`Now crown ${esc(pp(w).name)} King or Queen.`,"duel:"+w,"Back to the crowning")});onQuit=()=>crownSheet()}
  else if(b.id==="toCrown")crownSheet();
  else if(b.id==="sum")summary();
  else if(b.id==="thawGo"){thaw();onQuit=()=>render()}
  else if(b.id==="skip"){const t=cur();t.frozen=0;log(t.name+" sat out a frozen turn",t.x);endTurn()}
  else if(b.id==="useSteal"){const t=cur(),o=other();t.powers.splice(t.powers.indexOf("steal"),1);back(o);log(t.name+" used Steal: "+o.name+" pushed back 1 stop",t.x);toast("Steal! "+o.name+" goes back 1 stop");render()}
  else if(b.id==="again"||b.id==="newMap"||b.id==="newMap2")setup();
});
$("scrim").onclick=()=>{if(!locked){shut();release()}};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!locked&&$("arena").hidden){shut();release()}});

function soon(){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:#1b1d22";
  d.innerHTML=`<div style="max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
    <span style="padding:5px 12px;border-radius:99px;background:#ffd23f;color:#15181e;font:800 12px Inter,system-ui;letter-spacing:.05em;text-transform:uppercase">Coming soon</span>
    <h2 style="margin:0;font:600 30px/1.15 Fredoka,Inter,system-ui;color:#eef1f6">The Road to the Crown</h2>
    <p style="margin:0;color:#9aa3b3">This game isn't open for you yet.</p>
    <a href="games.html" style="margin-top:6px;padding:12px 20px;border-radius:15px;background:#2ec4b6;color:#15181e;font:700 15px Inter,system-ui;text-decoration:none">Back to the games</a></div>`;
  document.body.appendChild(d)}

// ---------- online: rooms, lobby, polling ----------
async function act(action,extra){try{const j=await RG.api(action,Object.assign({id:RID},extra||{}));if(j.room)gotRoom(j.room)}catch(e){toast(e.message)}}
function openRoom(id,data){RID=id||0;ROOM=null;BV=-1;SENT="";S=null;summed=0;setupSent=0;shut();buildMap();
  const u=new URL(location.href);if(RID)u.searchParams.set("room",RID);else u.searchParams.delete("room");history.replaceState(null,"",u);
  if(data)gotRoom(data);else render();poll()}
function gotRoom(r){const was=ROOM;ROOM=r;RID=r.id;const me=meId();
  if(r.status==="lobby"&&!WATCH&&r.invited.includes(me)&&!r.players.some(p=>p.id===me)&&!autoJoined[r.id]){autoJoined[r.id]=1;act("room_join")} // opened from an invite: join right away
  if(r.status==="done"&&!r.board){toast("That game was closed.");openRoom(0);return}
  if(r.status!=="lobby"&&r.board){
    if(r.bv!==BV&&!busy()){N=r.board.N;S=r.board.S;BV=r.bv;SENT=boardJSON();REMOTE=true;render();REMOTE=false;
      if(!S.over&&canAct()&&S.teams.some(t=>t.at==="S")&&!$("sheet").classList.contains("on"))crownSheet();}
    else side();
    if(S&&S.over&&S.crowned&&(!summed||(was&&!was.event_id&&r.event_id&&$("sheet").classList.contains("on")))){summed=1;summary()}
    return}
  if(r.status==="playing"&&!r.board&&r.host===me&&!WATCH&&!setupSent){setupSent=1;firstBoard();return}
  render()}
async function poll(){clearTimeout(poll.t);
  try{if(RID){const j=await RG.api("room_state",undefined,{q:"&id="+RID+(ROOM&&ROOM.id===RID?"&v="+ROOM.v:"")});if(!j.same)gotRoom(j.room)}
    else{const j=await RG.api("room_list");ROOMS=j.rooms.filter(r=>r.game==="crown");if(WATCH&&ROOMS.length){openRoom(ROOMS[0].id);return}side()}}
  catch(e){if(/not found/i.test(e.message||"")){openRoom(0);return}}
  poll.t=setTimeout(poll,document.hidden?5000:RID?1500:4000)}

(async function(){
  buildMap();drawMap();
  let st=null;try{const r=await RG.login();ME=r.me;st=r.state}catch(e){$("side").innerHTML=`<div class="card raise"><b>Can't reach the game server</b><p class="hint">${esc(e.message)}</p></div>`;return}
  if(Array.isArray(st.players)&&st.players.length){PEOPLE={};st.players.forEach(p=>PEOPLE[p.id]={name:p.name,short:p.short||String(p.name).slice(0,2),color:p.color||"#9aa3b3",avatar:p.avatar||""})}
  if(st.crown)CROWN=st.crown;
  // Admin > Access: a player whose games are off, and for whom this game isn't ticked as open, sees Coming soon
  const a=st.access;if(!WATCH&&ME&&!+ME.is_admin&&a&&a.nogames.includes(ME.id)&&!a.open.includes("crown")){soon();return}
  if(WATCH){document.body.classList.add("watch");navSync()}
  if(!RID){try{const j=await RG.api("room_list");ROOMS=j.rooms.filter(r=>r.game==="crown");const mine=ROOMS.find(r=>r.members.includes(ME.id)||(r.status==="lobby"&&r.invited.includes(ME.id)));if(mine&&!WATCH)RID=mine.id;else if(WATCH&&ROOMS.length)RID=ROOMS[0].id}catch(e){}}
  render();poll();
})();
})();
</script>
