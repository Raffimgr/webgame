<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play Together</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Shenandoah Cabin"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the hub (invites, start a game, open games), then one game: lobby with Ready checks, a shared countdown, the game, the results.
   Everyone plays on their own phone. Same dark look as Poker on phones. */
:root{color-scheme:dark;--bg:#1b1d22;--fg:#eef1f6;--mut:#9aa3b3;--dim:#6b7383;--ink:#15181e;--sheet:#2a2e35;
  --raise:linear-gradient(145deg,#30343c,#25282e);--raise-sh:-5px -5px 12px rgba(255,255,255,.035),7px 9px 18px rgba(0,0,0,.55);
  --well:#202328;--well-sh:inset 4px 4px 10px rgba(0,0,0,.55),inset -3px -3px 8px rgba(255,255,255,.035);
  --teal:#2ec4b6;--gold:#ffd23f;--green:#7be08a;--red:#ff8f8f;--pink:#e0459b;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--play:"Fredoka","Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:#1b1d22;color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:900px;min-height:100vh;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px}
.top h1{margin:0;flex:1;min-width:0;font:600 24px/1.2 var(--play)}
.top h1 small{display:block;font:500 13px var(--font);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut);background:var(--raise);box-shadow:var(--raise-sh);text-decoration:none}
.lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;color:var(--dim)}
.muted{color:var(--mut)}
.col{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--raise);box-shadow:var(--raise-sh);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:18px;background:var(--well);box-shadow:var(--well-sh)}
.seg button{padding:10px 14px;border-radius:13px;font-weight:700;color:var(--mut);min-width:48px;text-align:center;font-size:14px}
.seg button.on{background:var(--teal);color:var(--ink);box-shadow:0 0 12px rgba(46,196,182,.4)}
.go{border-radius:18px;padding:15px 22px;font:700 17px var(--font);color:var(--ink);background:var(--x,var(--teal));box-shadow:0 0 16px color-mix(in srgb,var(--x,var(--teal)) 40%,transparent);text-align:center;text-decoration:none;display:inline-block;transition:transform .08s}
.go:active{transform:translateY(2px)}
.go:disabled{opacity:.35;box-shadow:none}
.go.ghost{background:var(--raise);color:var(--fg);box-shadow:var(--raise-sh)}
.go.sm{padding:11px 16px;font-size:14.5px;border-radius:15px}
.go.wide{width:100%}
.chip{font-weight:700;font-size:13px;padding:6px 11px;border-radius:99px;background:var(--well);box-shadow:var(--well-sh);font-variant-numeric:tabular-nums;white-space:nowrap}
.av{width:var(--s,38px);height:var(--s,38px);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s,38px)*.32);color:var(--ink);background:var(--x);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avs{display:flex;flex-wrap:wrap;gap:4px}
.me{display:flex;align-items:center;gap:10px}
.me b{flex:1;min-width:0;font-weight:700}
.me button{color:var(--mut);font-size:13px;font-weight:600;padding:8px}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.err{color:#ff9c9c;font-weight:600;font-size:13.5px;text-align:center}
.big{font:700 28px/1.15 var(--play);margin:0;text-align:center;color:var(--gold)}
/* hub */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.games{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:22px;background:var(--raise);box-shadow:var(--raise-sh);text-align:left;text-decoration:none;color:inherit}
.gcard .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font:700 22px var(--play);background:var(--well);box-shadow:inset 3px 3px 8px rgba(0,0,0,.55);color:var(--x)}
.gcard b{font:600 19px var(--play)}
.gcard span{color:var(--mut);font-size:13.5px}
.room{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--raise);box-shadow:var(--raise-sh);text-align:left;width:100%}
.room.inv{box-shadow:0 0 0 2px var(--green),0 0 22px rgba(123,224,138,.3)}
.room .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.room .t b{font:600 18px/1.2 var(--play)}
.room .t small{color:var(--mut);font-size:13px}
.room em{font-style:normal;font-weight:700;font-size:13px;color:var(--teal);flex:none}
.room.inv em{color:var(--green)}
/* new game */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--well);box-shadow:var(--well-sh);font-weight:600;font-size:13px;position:relative}
.who button.on{background:#33383f;box-shadow:0 0 0 2px var(--x),0 0 14px color-mix(in srgb,var(--x) 40%,transparent)}
.who button.on::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--green);color:var(--ink);font:800 12px/20px var(--font);text-align:center}
.who button:disabled{cursor:default}
.minds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.minds button{padding:10px 12px;border-radius:14px;background:var(--well);box-shadow:var(--well-sh);font-weight:650;font-size:14px;text-align:left}
.minds button small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.minds button.on{background:var(--teal);color:var(--ink);box-shadow:0 0 12px rgba(46,196,182,.4)}
.who button.soon,.minds button.soon{opacity:.45;cursor:default}
.who button .sn,.minds button .sn{display:block;color:var(--gold);font:800 10.5px var(--font);letter-spacing:.04em;text-transform:uppercase}
.minds button.on small{color:#15403b}
.tog{display:flex;align-items:center;gap:12px;font-weight:600}
.tog input{width:22px;height:22px;accent-color:var(--teal)}
/* during a race */
#stage{flex:1;display:flex;flex-direction:column;min-height:72vh}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.strip .av{opacity:.4}
.strip .av.done{opacity:1;box-shadow:0 0 0 2px var(--green)}
/* imposter */
.secret{border-radius:28px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:#fff;color:#15181e;box-shadow:0 8px 0 #c9cfd8,0 18px 36px rgba(0,0,0,.35);width:100%}
.secret u{text-decoration:none;font-weight:800}
.secret small{font:700 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:#6b7383}
.secret b{font:700 clamp(34px,10vw,54px)/1.05 var(--play)}
.secret.imp{background:var(--pink);color:#fff;box-shadow:0 8px 0 #9c2a68,0 18px 36px rgba(0,0,0,.35)}
.secret.imp small{color:#ffd6ea}
.secret.hid{background:#33383f;color:var(--fg);box-shadow:0 8px 0 #1f2227}
.secret.hid small{color:var(--mut)}
.vote{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.vote button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--raise);box-shadow:var(--raise-sh);font-weight:650;font-size:14px}
.vote button.on{box-shadow:0 0 0 3px var(--pink),0 0 18px rgba(224,69,155,.5)}
.vote button small{color:var(--mut);font-size:12px;font-weight:600}
.in{width:100%;padding:14px;border-radius:14px;border:0;background:var(--well);box-shadow:var(--well-sh);font-size:17px}
.in:focus{outline:2px solid var(--teal)}
/* results */
.res{display:flex;flex-direction:column;gap:10px}
.rr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--raise);box-shadow:var(--raise-sh)}
.rr .pl{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--play);background:var(--well);box-shadow:var(--well-sh);flex:none;color:var(--mut)}
.rr.first .pl{background:var(--gold);color:var(--ink);box-shadow:0 0 14px rgba(255,210,63,.45)}
.rr .t{flex:1;min-width:0}
.rr .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .t small{display:block;color:var(--mut);font-size:13px}
.rr .v{text-align:right;font:700 20px var(--play);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--gold)}
.rr .v small{display:block;font:700 12px var(--font);color:var(--mut)}
.saved{text-align:center;font-weight:700;color:var(--green)}
/* codenames */
.cngrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cn{display:grid;place-items:center;min-height:54px;padding:4px 2px;border-radius:12px;background:#eef1f6;color:#15181e;font:700 clamp(10px,2.9vw,15px)/1.1 var(--font);text-align:center;word-break:break-word;box-shadow:0 3px 0 #b8bfca}
.cn:disabled{cursor:default}
.cn.sel{outline:3px solid var(--gold);outline-offset:1px}
.cn.open{box-shadow:none}
/* trivia */
.ta{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:#eef1f6;color:#15181e;box-shadow:0 5px 0 #b8bfca;font-weight:700;font-size:17px;text-align:left}
.ta .tl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#15181e;color:#eef1f6;flex:none;font:700 16px var(--play)}
.ta .tx{flex:1;min-width:0}
.ta:disabled{cursor:default}
.ta.pick{background:var(--teal)}
.ta.ok{background:var(--green)}
.ta.no{background:var(--red)}
.ta:disabled:not(.pick):not(.ok):not(.no){opacity:.75}
.tbarw{height:10px;border-radius:99px;background:var(--well);box-shadow:var(--well-sh);overflow:hidden}
.tbar{height:100%;background:var(--gold);border-radius:99px;transition:width .1s linear}
/* last one standing */
.pad{width:100%;min-height:52vh;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:#e5484d;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad b{font:700 clamp(36px,11vw,64px)/1.05 var(--play)}
.pad small{font-weight:600;opacity:.85}
.pad.green{background:#22c55e}
.pad.early{background:#7a1f22}
.pad.done{background:var(--raise);color:var(--fg);box-shadow:var(--raise-sh);min-height:30vh}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="ttl">Play together <small>Everyone plays on their own phone</small></h1><a class="pill" id="back" href="games.html">Home</a></div>
  <div id="app"><div class="empty">Loading…</div></div>
  <div id="stage" hidden></div>
</div>
<script src="mind.js"></script>
<script src="rg.js?v=9"></script>
<script src="lobby.js?v=2"></script>
<script>
(function(){
"use strict";
const esc=RG.esc,$=s=>document.querySelector(s),app=$("#app"),stage=$("#stage"),L=RGLobby;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const autoJoined={};
let me=null,people={},coins=[10,7,5,4,3,2,1],roomId=null,room=null,rooms=null,invites=[],timer=null,fails=0,busy=false,err="",mode="hub",form=null,race=null,peek=false,draft="";

const GAMES={
  imposter:{name:"Imposter",ic:"?",x:"#e0459b",how:"Everyone gets the secret word on their phone, except one imposter. Take turns saying one word about it, then vote out the faker.",min:3},
  race:{name:"Mind race",ic:"⚡",x:"#2ec4b6",how:"Everyone plays the same mind game at the same moment. Finish first with the most seconds left to win.",min:2},
  trivia:{name:"Trivia race",ic:"Q",x:"#aab7ff",how:"The same 10 questions on every phone at once. A right answer scores the seconds that were left.",min:2},
  reaction:{name:"Last One Standing",ic:"●",x:"#7be08a",how:"Tap the moment your screen turns green. Too early, or the slowest, and you're out. Last one in wins.",min:2},
  likely:{name:"Most Likely To",ic:"★",x:"#ffbf99",how:"\"Who is most likely to…?\" Everyone votes on their phone. Score a point when you pick the same person as most of the group.",min:3},
  werewolf:{name:"Werewolf",ic:"🐺",x:"#b48cff",how:"Secret wolves hide in the village. Each night the wolves strike, the seer peeks and the doctor protects, all on your phones. Each day, vote someone out.",min:4},
  spyfall:{name:"Spyfall",ic:"🕵",x:"#7ee8f0",how:"Everyone knows the secret place, except the spy. Ask each other questions to catch the spy before the spy figures out the place.",min:3},
  codenames:{name:"Codenames",ic:"▦",x:"#ff8f8f",how:"Two teams. Your spymaster sees which words are yours and gives one-word clues. Find all your words first, and never touch the assassin.",min:4},
  poker:{name:"Poker",ic:"♠",x:"#ffd23f",how:"Texas Hold'em. Each phone shows only its own cards. Others can watch.",min:2}};
const CATS=["any","Camping","Animals","Food","Places","Jobs","Sports","At home","Nature"];
const MINDCOL={quickmath:"#ffd23f",colorclash:"#f7b8d2",numbermemory:"#aab7ff",wordscramble:"#d4f09a",biggerorsmaller:"#ffbf99",gridrecall:"#7ee8f0"};
const who=id=>people[id]||{id,name:id,short:String(id).slice(0,2),color:"#9aa3b3"};
const nameOf=id=>who(id).name;
const av=(id,s)=>{const p=who(id);return `<span class="av" style="--x:${esc(p.color)};--s:${s||38}px">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc(p.short)}</span>`};
const coinsFor=p=>p>=1&&p<=coins.length?coins[p-1]:0;
/* Admin > Access: what a game counts as (a mind race is the mind game it races on), and whether I may start it */
const gidOf=(game,mind)=>game==="race"?"mind:"+mind:game==="crown"?"crown":"play:"+game;
const gameOpen=k=>k==="race"?RG.canAny("mind:"):RG.canPlay("play:"+k);
const SN=`<small class="sn">${RG.SOON}</small>`;
function setTitle(t,sub){$("#ttl").innerHTML=esc(t)+`<small>${esc(sub)}</small>`}

/* ---------- talking to the server ---------- */
function schedule(ms){clearTimeout(timer);timer=setTimeout(tick,ms)}
async function tick(){
  clearTimeout(timer);if(document.hidden)return;
  try{
    if(roomId){const t0=Date.now(),j=await RG.api("room_state",undefined,{q:"&id="+roomId+(room&&room.id===roomId?"&v="+room.v:"")}),t1=Date.now();L.clock(j.same?{now:j.now}:j.room,t0,t1);if(!j.same)setRoom(j.room)}
    else if(mode==="hub"){const [a,b]=await Promise.all([RG.api("room_list"),RG.api("invites")]);rooms=a.rooms;invites=b.invites;draw()}
    fails=0;
  }catch(e){
    fails++;
    if(e.status===401){location.reload();return}
    if(e.status===404&&roomId){RG.toast("That game is gone.");openRoom(null);return}
  }
  if(roomId||mode==="hub")schedule(fails?Math.min(15000,1200*2**fails):(roomId?1200:3000));
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
async function send(action,extra){
  if(busy)return;busy=true;err="";draw();
  try{const j=await RG.api(action,Object.assign({id:roomId},extra||{}));if(j.room){if(j.room.id!==roomId){busy=false;openRoom(j.room.id)}setRoom(j.room)}}
  catch(e){err=e.message}
  finally{busy=false;draw()}
}
function setRoom(r){if(r.game==="crown"){location.replace("map.html?room="+r.id);return} // The Road to the Crown has its own page

  L.clock(r);
  if(r.game==="poker"){location.replace("online.html?room="+r.id);return}
  const prev=room;room=r;
  if(r.status==="lobby"&&!r.me.in&&(r.invited||[]).includes(me.id)&&!autoJoined[r.id]){autoJoined[r.id]=1;setTimeout(()=>send("room_join"),0)} // opening an invite = joining it
  if(r.next&&r.status==="done"&&!r.me.host&&!(prev&&prev.next)){RG.toast("New game! Opening the lobby.");openRoom(r.next);return}
  draw();
}
function openRoom(id){
  roomId=id;room=null;err="";peek=false;draft="";stopRace();mode=id?"room":"hub";
  const u=new URL(location.href);u.searchParams.delete("new");if(id)u.searchParams.set("room",id);else u.searchParams.delete("room");history.replaceState(null,"",u);
  draw();window.scrollTo(0,0);tick();
}

/* ---------- screens ---------- */
function draw(){
  if(!me)return;
  RG.playing(mode==="room"&&room&&room.status==="playing"); // the bottom bar hides only while the game runs
  const bk=$("#back");
  if(mode==="hub"){bk.textContent="Home";bk.href="games.html";bk.onclick=null}
  else{bk.textContent="All games";bk.href="play.html";bk.onclick=e=>{e.preventDefault();if(race&&race.live&&!confirm("Leave the race? You'll get no place."))return;openRoom(null)}}
  if(mode==="hub")return drawHub();
  if(mode==="new")return drawNew();
  if(!room){app.innerHTML='<div class="empty">Opening the game…</div>';return}
  if(room.status==="lobby")return drawLobby();
  if(room.status==="done")return drawDone();
  if(L.countdown(room,()=>draw()))return; // the countdown covers the screen; the game draws when it ends
  if(room.game==="race")return drawRace();
  if(room.game==="imposter")return drawImposter();
  if(room.game==="trivia")return drawTrivia();
  if(room.game==="reaction")return drawReaction();
  if(room.game==="likely")return drawLikely();
  if(room.game==="werewolf")return drawWerewolf();
  if(room.game==="spyfall")return drawSpyfall();
  if(room.game==="codenames")return drawCodenames();
}

/* Timed games move on when time is up: any phone may give the server a nudge (it checks the clock itself). */
let nudging=0;
async function nudge(){if(nudging>Date.now()||!roomId)return;nudging=Date.now()+900;
  try{const j=await RG.api("room_move",{id:roomId,do:"tick"});if(j.room&&(!room||j.room.v!==room.v))setRoom(j.room)}catch(e){}}
setInterval(()=>{
  const r=room;if(!r||r.status!=="playing"||!r.me.in)return;const now=L.serverNow();
  if(r.game==="trivia"){
    const t=$("#tt");if(t&&r.phase==="q"){const left=Math.max(0,r.at+r.time-now);t.textContent=Math.ceil(left);const bar=$("#tbar");if(bar)bar.style.width=(left/r.time*100)+"%"}
    if((r.phase==="q"&&now>=r.at+r.time)||(r.phase==="reveal"&&now>=r.at+r.show))nudge();
  }
  if(r.game==="spyfall"&&r.phase==="talk"){const left=Math.max(0,Math.ceil(r.at+r.time-now)),t=$("#spyt");if(t)t.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0&&!$("#votenow"))draw()}
  if(r.game==="reaction"){
    const pad=$("#pad");if(pad&&r.phase==="wait"&&!pad.dataset.done){const g=now>=r.go_at;if(g!==pad.classList.contains("green")){pad.classList.toggle("green",g);pad.querySelector("b").textContent=g?"TAP!":"Wait for green…"}}
    if((r.phase==="wait"&&now>=r.go_at+3)||(r.phase==="result"&&now>=r.at+3.5))nudge();
  }
},100);

function roomRow(r,inv){
  const g=GAMES[r.game]||{name:r.game},ids=r.members;
  const sub=r.status==="lobby"?`Waiting in the lobby · ${r.ready.length} of ${r.invited.length} ready`:"Playing now";
  const soon=!ids.includes(me.id)&&!RG.canPlay(gidOf(r.game,r.mind||""));
  return `<button class="room${inv?" inv":""}" data-id="${r.id}" data-g="${r.game}"${soon?' data-soon="1"':""}><span class="t"><b>${esc(r.label)}</b><small>${inv?esc(nameOf(r.host))+" invited you · ":"Host "+esc(nameOf(r.host))+" · "}${sub}</small><span class="avs">${(r.status==="lobby"?r.invited:ids).map(i=>av(i,26)).join("")}</span></span>

function sub(){return room.game==="race"?"Mind race · host "+nameOf(room.host):"Host "+nameOf(room.host)}

/* ---------- mind race ---------- */
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const realRandom=Math.random;
function stopRace(){if(race){if(race.game)race.game.stop();Math.random=realRandom;race=null}stage.hidden=true;stage.innerHTML="";app.hidden=false}
function drawRace(){
  const r=room,mine=r.me.in,doneIds=r.done_ids||[],myRes=r.results&&r.results[me.id];
  setTitle(r.label,sub());
  // my own game: started once, never redrawn by polling
  if(mine&&!myRes&&!(race&&race.sent)){
    if(!race||race.room!==r.id){
      const elapsed=Math.max(0,L.serverNow()-r.start_at);
      race={room:r.id,live:true,sent:false};
      Math.random=rng(r.seed); // same puzzles on every phone
      app.hidden=true;stage.hidden=false;
      stage.innerHTML='<div class="strip" id="strip"></div><div id="mg" style="flex:1;display:flex;flex-direction:column"></div>';
      race.game=MindGames.play(stage.querySelector("#mg"),{game:r.mind,level:r.level,color:MINDCOL[r.mind]||"#2ec4b6",autostart:true,seeded:true,elapsed,doneLabel:"See who's winning",
        onFinish(res){Math.random=realRandom;race.live=false;race.sent=true;send("room_move",{do:"finish",win:res.win,score:res.score,left:res.left})},
        onDone(){stopRace();draw()}});
    }
    strip();return;
  }
  if(race&&race.live)return strip();
  if(race&&race.sent&&!stage.hidden)return strip(); // the "you did it" box is still up; its button brings the board
  app.hidden=false;stage.hidden=true;
  const left=r.players.filter(p=>!doneIds.includes(p.id)).map(p=>p.id);
  app.innerHTML=`<div class="col">${mine?"":`<p class="muted" style="margin:0;text-align:center">You're watching this race.</p>`}
    ${myRes?`<div class="panel" style="text-align:center"><p class="big">${myRes.win?myRes.left+" seconds left!":"You scored "+myRes.score}</p><p class="muted" style="margin:0">${myRes.win?"You finished the game.":"The timer ran out."} Waiting for ${esc(L.names(left,people))||"the others"} to finish.</p></div>`:""}
    <div class="panel"><span class="lab">Finished</span><div class="col" style="gap:8px">${r.players.map(p=>`<div class="lb-row">${av(p.id,32)}<span class="n">${esc(p.name)}</span><span class="lb-st">${doneIds.includes(p.id)?'Done <span class="lb-ok">✓</span>':'Playing… <span class="lb-wait"></span>'}</span></div>`).join("")}</div></div>
    ${r.me.host?`<button class="go ghost sm" id="end">End the race now (unfinished players get no place)</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const e=$("#end");if(e)e.onclick=()=>{if(confirm("End the race for everyone now?"))send("room_close")};
}
function strip(){const s=$("#strip");if(!s||!room)return;const d=room.done_ids||[];
  s.innerHTML=`<span>Finished:</span>${room.players.map(p=>`<span class="av${d.includes(p.id)?" done":""}" style="--x:${esc(who(p.id).color)};--s:26px" title="${esc(p.name)}">${esc(who(p.id).short)}</span>`).join("")}`}

/* ---------- imposter ---------- */
function drawImposter(){
  const r=room,mine=r.me.in,imp=r.role==="imposter";
  setTitle("Imposter",sub());
  let h="";
  if(r.phase==="clue"){
    const card=!mine?`<div class="secret hid"><small>You're watching</small><b>Shh…</b><span>Only the players see the word.</span></div>`
      :peek?(imp?`<div class="secret imp"><small>You are the</small><b>IMPOSTER</b><span>Hint: the word is in <u>${esc(r.cat)}</u>. Blend in!</span></div>`
        :`<div class="secret"><small>The secret word (${esc(r.cat)})</small><b>${esc(r.word)}</b><span>One of you doesn't know it.</span></div>`)
      :`<div class="secret hid"><small>Your secret card</small><b>Tap to look</b><span>Keep your screen away from the others.</span></div>`;
    h=`<button id="peek" style="width:100%">${card}</button>
      <div class="panel"><span class="lab">How to play</span><p style="margin:0">Go around the circle, starting with <b>${esc(nameOf(r.first))}</b>. Everyone says <b>one word</b> about the secret word. Not too obvious, or the imposter learns it! The imposter has to bluff. Do 1 or 2 rounds, then vote.</p></div>
      ${r.me.host?`<button class="go wide" id="votenow" style="--x:var(--pink)" ${busy?"disabled":""}>Time to vote</button>`:`<p class="muted" style="margin:0;text-align:center">${esc(nameOf(r.host))} starts the vote when you're ready.</p>`}`;
  }else if(r.phase==="vote"){
    const voted=r.voted||[],waitFor=r.players.filter(p=>!voted.includes(p.id)).map(p=>p.id);
    h=`<div class="panel"><span class="lab">Vote: who is the imposter?</span>
      ${mine?`<div class="vote" id="vote">${r.players.filter(p=>p.id!==me.id).map(p=>`<button data-v="${esc(p.id)}" class="${r.my_vote===p.id?"on":""}" ${busy?"disabled":""}>${av(p.id,48)}${esc(p.name)}</button>`).join("")}</div>
      <p class="muted" style="margin:0;font-size:13.5px">${r.my_vote?`You voted for ${esc(nameOf(r.my_vote))}. You can still change it.`:"Tap a name. Your vote is secret."}</p>`:`<p class="muted" style="margin:0">You're watching. The players are voting.</p>`}</div>
      <p class="muted" style="margin:0;text-align:center">${waitFor.length?`Still voting: ${esc(L.names(waitFor,people))}`:"Counting the votes…"}</p>`;
  }else if(r.phase==="guess"){
    h=`<div class="panel" style="text-align:center"><p class="big" style="color:var(--pink)">${esc(nameOf(r.caught_id))} was caught!</p>
      ${imp?`<p style="margin:0">One last chance: guess the secret word to steal the win.</p><input class="in" id="guess" placeholder="Your guess" autocomplete="off" value="${esc(draft)}"><button class="go wide" id="sendGuess" style="--x:var(--pink)" ${busy?"disabled":""}>Guess</button>`
        :`<p class="muted" style="margin:0">${esc(nameOf(r.caught_id))} gets one guess at the word. If they get it, the imposter still wins.</p>`}</div>`;
  }
  app.innerHTML=`<div class="col">${h}${err?`<div class="err">${esc(err)}</div>`:""}${r.me.host?`<button class="go ghost sm" id="end">End this round</button>`:""}</div>`;
  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f};
  on("peek",()=>{if(mine){peek=!peek;draw()}});
  on("votenow",()=>send("room_move",{do:"vote_now"}));
  const v=$("#vote");if(v)v.onclick=e=>{const b=e.target.closest("button");if(b)send("room_move",{do:"vote",target:b.dataset.v})};
  const g=$("#guess");if(g){g.oninput=()=>{draft=g.value};g.focus()}
  on("sendGuess",()=>send("room_move",{do:"guess",guess:($("#guess")||{}).value||""}));
  on("end",()=>{if(confirm("End this round without a winner?"))send("room_close")});
}

/* ---------- trivia race ---------- */
function board(pts,lim){return `<div class="col" style="gap:6px">${Object.entries(pts||{}).sort((a,b)=>b[1]-a[1]).slice(0,lim||20).map(([id,n],k)=>`<div class="lb-row">${av(id,30)}<span class="n">${esc(nameOf(id))}</span><span class="chip">${n}</span></div>`).join("")}</div>`}
function drawTrivia(){
  const r=room,mine=r.me.in,rev=r.phase==="reveal",my=r.mine,L2="ABCD";
  setTitle("Trivia race",`Question ${r.i+1} of ${r.n}`);
  const opt=(o,k)=>{let cls="",tag="";
    if(rev){if(k===r.right)cls="ok";else if(my&&my[0]===k)cls="no"}else if(my&&my[0]===k)cls="pick";
    if(rev){const who=Object.entries(r.ans||{}).filter(([,a])=>a[0]===k).map(([id])=>id);tag=who.length?`<span class="avs">${who.map(i=>av(i,22)).join("")}</span>`:""}
    return `<button class="ta ${cls}" data-k="${k}" ${!mine||my||rev||busy?"disabled":""}><span class="tl">${L2[k]}</span><span class="tx">${esc(o)}</span>${tag}</button>`};
  const left=Math.max(0,Math.ceil(r.at+r.time-L.serverNow()));
  const myGain=rev&&my?my[1]:null;
  app.innerHTML=`<div class="col">
    ${rev?"":`<div class="tbarw"><div class="tbar" id="tbar" style="width:${left/r.time*100}%"></div></div>`}
    <div class="secret" style="gap:4px"><small>${rev?"The answer":"Question "+(r.i+1)} · ${rev?"next one coming…":`<span id="tt">${left}</span> s`}</small><b style="font-size:clamp(22px,6vw,32px)">${esc(r.q)}</b></div>
    <div class="col" style="gap:10px" id="opts">${r.opts.map(opt).join("")}</div>
    ${rev?`<p class="big" style="font-size:22px;color:${myGain?"var(--green)":"var(--mut)"}">${!mine?"":myGain?"+"+myGain+" points!":my?"Not this one":"Too slow!"}</p>`
      :`<p class="muted" style="margin:0;text-align:center">${!mine?"You're watching.":my?"Locked in. Waiting for the others…":"Faster = more points."} ${r.answered.length} of ${r.players.length} answered</p>`}
    <div class="panel"><span class="lab">Points</span>${board(r.pts,9)}</div>
    ${r.me.host?`<button class="go ghost sm" id="end">End the game now</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const o=$("#opts");o.onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;send("room_move",{do:"answer",i:r.i,choice:+b.dataset.k})};
  const e=$("#end");if(e)e.onclick=()=>{if(confirm("End the game now? Points so far count."))send("room_close")};
}

/* ---------- last one standing ---------- */
function drawReaction(){
  const r=room,alive=r.alive.includes(me.id),tapped=r.tapped.includes(me.id),last=r.last;
  setTitle("Last One Standing",`Round ${r.round} · ${r.alive.length} still in`);

    :`<button class="pad${L.serverNow()>=r.go_at?" green":""}" id="pad"><b>${L.serverNow()>=r.go_at?"TAP!":"Wait for green…"}</b><small>Tap the moment it turns green</small></button>`;
  else if(r.phase==="result"&&last){const t=last.taps||{},f=x=>x==null?"no tap":x<0?"too early":Math.round(x*1000)+" ms";
    pad=`<div class="pad done"><b>${last.out.length?esc(L.names(last.out,people))+" "+(last.out.length>1?"are":"is")+" out!":"Everyone slipped: again!"}</b><small>Next round in a moment</small></div>
      <div class="col" style="gap:6px">${Object.keys(t).concat(r.alive.filter(i=>!(i in t))).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>((t[a]??9)<0?9:(t[a]??9))-((t[b]??9)<0?9:(t[b]??9))).map(id=>`<div class="lb-row${last.out.includes(id)?" away":""}">${av(id,30)}<span class="n">${esc(nameOf(id))}</span><span class="chip">${f(t[id])}</span></div>`).join("")}</div>`}
  else pad=`<div class="pad done"><b>${r.me.in?"You're out":"You're watching"}</b><small>Cheer the others on</small></div>`;
  app.innerHTML=`<div class="col">${pad}
    <div class="panel"><span class="lab">Still in</span><div class="avs">${r.alive.map(i=>av(i,34)).join("")}</div>${r.outs.length?`<span class="lab">Out</span><div class="avs" style="opacity:.5">${r.outs.flat().map(i=>av(i,28)).join("")}</div>`:""}</div>
    ${r.me.host?`<button class="go ghost sm" id="end">End the game now</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const p=$("#pad");if(p)p.addEventListener("pointerdown",ev=>{ev.preventDefault();const at=L.serverNow();p.dataset.done=1;
    const early=at<r.go_at;p.classList.remove("green");p.classList.add(early?"early":"done");p.querySelector("b").textContent=early?"Too early!":Math.round((at-r.go_at)*1000)+" ms";
    send("room_move",{do:"tap",round:r.round,at})},{once:true});
  const e=$("#end");if(e)e.onclick=()=>{if(confirm("End the game now? Everyone still in shares 1st place."))send("room_close")};
}

/* ---------- most likely to ---------- */
function drawLikely(){

  let h=`<div class="secret" style="gap:4px"><small>Question ${r.i+1} of ${r.n}</small><b style="font-size:clamp(22px,6vw,32px)">${esc(r.prompt)}</b></div>`;

    h+=mine?`<div class="vote" id="vote">${r.players.map(p=>`<button data-v="${esc(p.id)}" class="${r.my_vote===p.id?"on":""}" ${busy?"disabled":""}>${av(p.id,48)}${esc(p.name)}${p.id===me.id?"<small>you</small>":""}</button>`).join("")}</div>
      <p class="muted" style="margin:0;text-align:center">${r.my_vote?`You picked ${esc(nameOf(r.my_vote))}. You can still change it.`:"Pick someone. Votes are secret until everyone has voted."}</p>`:`<p class="muted" style="margin:0;text-align:center">You're watching.</p>`;
    h+=`<p class="muted" style="margin:0;text-align:center">${waitFor.length?"Still voting: "+esc(L.names(waitFor,people)):""}</p>`}
  else{const t=r.tally||{},max=Math.max(...Object.values(t));
    h+=`<div class="panel"><span class="lab">The group says</span>${Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="lb-row">${av(id,34)}<span class="n">${esc(nameOf(id))}</span><span class="chip" style="${n===max?"background:var(--gold);color:var(--ink)":""}">${n} vote${n>1?"s":""}</span></div>`).join("")}
      <p class="muted" style="margin:0;font-size:13.5px">Everyone who picked ${esc(L.names(Object.keys(t).filter(i=>t[i]===max),people))} gets a point.</p></div>
      ${mine?`<button class="go wide" id="next" style="--x:${GAMES.likely.x}" ${busy?"disabled":""}>${r.i+1>=r.n?"See the final scores":"Next question"}</button>`:""}`}
  h+=`<div class="panel"><span class="lab">Points</span>${board(r.pts,9)}</div>`;
  app.innerHTML=`<div class="col">${h}${r.me.host?`<button class="go ghost sm" id="end">End the game now</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const v=$("#vote");if(v)v.onclick=e=>{const b=e.target.closest("button");if(b)send("room_move",{do:"vote",target:b.dataset.v})};
  const n=$("#next");if(n)n.onclick=()=>send("room_move",{do:"next"});
  const e=$("#end");if(e)e.onclick=()=>{if(confirm("End the game now? Points so far count."))send("room_close")};
}

/* ---------- werewolf ---------- */
const WW={wolf:{n:"Werewolf",ic:"🐺",c:"#e5484d",d:"Each night, pick someone for the pack to get rid of. By day, act innocent!"},
  seer:{n:"Seer",ic:"🔮",c:"#b48cff",d:"Each night, check one player: you'll see if they're a wolf. Help the village without giving yourself away."},
  doctor:{n:"Doctor",ic:"💉",c:"#7be08a",d:"Each night, protect one player (you can pick yourself). If the wolves pick them, they survive."},
  villager:{n:"Villager",ic:"🧑‍🌾",c:"#ffd23f",d:"Find the wolves and vote them out. At night you just pick who you suspect (it hides who has a real job)."}};
function grid(ids,sel,attr,dis){return `<div class="vote" id="pick">${ids.map(id=>`<button data-${attr}="${esc(id)}" class="${sel===id?"on":""}" ${dis?"disabled":""}>${av(id,48)}${esc(nameOf(id))}${id===me.id?"<small>you</small>":""}</button>`).join("")}</div>`}
function drawWerewolf(){
  const r=room,mine=r.me.in,alive=r.alive.includes(me.id),ro=WW[r.role]||{};
  setTitle("Werewolf",`${r.phase==="night"?"Night":"Day"} ${r.round} · ${r.alive.length} still in`);
  const cnt=Object.entries(r.count||{}).map(([k,n])=>n+" "+(WW[k]?WW[k].n.toLowerCase():k)+(n>1?"s":"")).join(", ");
  const card=!mine?"":peek?`<button id="peek" style="width:100%"><div class="secret" style="background:${ro.c};color:#15181e;box-shadow:0 8px 0 rgba(0,0,0,.3)"><small style="color:#15181e">You are the</small><b>${ro.ic} ${ro.n}</b><span>${ro.d}</span>${r.pack&&r.pack.length>1?`<span><b>Your pack:</b> ${esc(L.names(r.pack,people))}</span>`:""}</div></button>`
    :`<button id="peek" style="width:100%"><div class="secret hid"><small>Your secret role</small><b>Tap to look</b><span>Keep it hidden from the others.</span></div></button>`;
  let h="";
  if(mine&&!alive)h+=`<div class="panel" style="text-align:center"><p class="big" style="color:var(--mut)">👻 You're out</p><p class="muted" style="margin:0">Ghosts see every role, so stay quiet and enjoy the show.</p></div>`;
  if(r.phase==="night"){
    h+=`<div class="panel" style="text-align:center;background:#1a1f3a"><p class="big" style="color:#aab7ff">🌙 Night ${r.round}</p><p style="margin:0">Everyone goes quiet. Everyone picks someone on their phone, so nobody can tell who has a real job.</p></div>`;
    if(mine&&alive){
      const others=r.alive.filter(i=>i!==me.id);
      const q={wolf:"Who does the pack attack?",seer:"Whose role do you want to check?",doctor:"Who do you protect tonight?",villager:"Who do you suspect?"}[r.role];
      const list=r.role==="wolf"?r.alive.filter(i=>!(r.pack||[]).includes(i)):r.role==="doctor"?r.alive:others;
      h+=`<div class="panel"><span class="lab">${q}</span>${grid(list,r.my_act,"t",busy)}
        ${r.role==="wolf"&&r.pack.length>1?`<p class="muted" style="margin:0;font-size:13.5px">Pack picks: ${Object.entries(r.pack_acts||{}).map(([w,t])=>esc(nameOf(w))+" → "+esc(nameOf(t))).join(" · ")||"none yet"}</p>`:""}
        <p class="muted" style="margin:0;font-size:13.5px">${r.my_act?`You picked ${esc(nameOf(r.my_act))}. You can still change it.`:"Tap a name."}</p></div>`;
    }
    h+=`<p class="muted" style="margin:0;text-align:center">${r.acted.length} of ${r.alive.length} done for the night</p>`;
  }else if(r.phase==="day"){
    const n=r.news||{};
    h+=`<div class="panel" style="text-align:center"><p class="big">☀️ Morning</p><p style="margin:0">${n.died?`<b>${esc(nameOf(n.died))}</b> was found eliminated in the night.`:n.saved?"The wolves struck, but the doctor saved the day. Nobody died!":"Nobody died last night."}</p></div>`;
    if(mine&&alive)h+=`<div class="panel"><span class="lab">Talk it over, then vote someone out</span>${grid(r.alive.filter(i=>i!==me.id),r.my_vote,"v",busy)}
      <button class="go ghost sm" id="skip" ${busy?"disabled":""} style="${r.my_vote==="skip"?"box-shadow:0 0 0 3px var(--pink)":""}">Skip: don't vote anyone out</button>
      <p class="muted" style="margin:0;font-size:13.5px">${r.my_vote?(r.my_vote==="skip"?"You chose to skip.":`You voted for ${esc(nameOf(r.my_vote))}.`)+" You can still change it.":"A tie means nobody goes."}</p></div>`;
    const wait=r.alive.filter(i=>!r.voted.includes(i));h+=`<p class="muted" style="margin:0;text-align:center">${wait.length?"Still voting: "+esc(L.names(wait,people)):""}</p>`;
  }else if(r.phase==="dusk"){
    const ro2=WW[r.out_role]||{};
    h+=`<div class="panel" style="text-align:center"><p class="big" style="color:${r.out?ro2.c:"var(--mut)"}">${r.out?`${esc(nameOf(r.out))} is out`:"Nobody is out"}</p>
      <p style="margin:0">${r.out?`They were ${r.out_role==="wolf"?"a <b>Werewolf</b>! 🐺":"the <b>"+ro2.n+"</b>. Oops."}`:"The vote was a tie, or too many skipped."}</p>
      <p class="muted" style="margin:0;font-size:13.5px">Votes: ${Object.entries(r.tally||{}).sort((a,b)=>b[1]-a[1]).map(([id,n])=>(id==="skip"?"Skip":esc(nameOf(id)))+" "+n).join(" · ")}</p></div>
      ${mine&&alive?`<button class="go wide" id="night" style="--x:#aab7ff" ${busy?"disabled":""}>🌙 Night falls</button>`:""}`;
  }
  if(r.role==="seer"&&r.seen&&r.seen.length)h+=`<div class="panel"><span class="lab">🔮 What you saw</span>${r.seen.map(([id,w])=>`<div class="lb-row">${av(id,30)}<span class="n">${esc(nameOf(id))}</span><span class="chip" style="${w?"background:#e5484d;color:#fff":""}">${w?"Wolf!":"Not a wolf"}</span></div>`).join("")}</div>`;
  if(r.roles)h+=`<div class="panel"><span class="lab">Everyone's roles (ghost view)</span>${Object.entries(r.roles).map(([id,k])=>`<div class="lb-row${r.alive.includes(id)?"":" away"}">${av(id,30)}<span class="n">${esc(nameOf(id))}</span><span class="chip">${WW[k].ic} ${WW[k].n}</span></div>`).join("")}</div>`;
  h+=`<div class="panel"><span class="lab">Still in</span><div class="avs">${r.alive.map(i=>av(i,34)).join("")}</div><p class="muted" style="margin:0;font-size:13px">In this game: ${esc(cnt)}.</p></div>`;
  app.innerHTML=`<div class="col">${card}${h}${r.me.host?`<button class="go ghost sm" id="end">End this game (no winner)</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f};
  on("peek",()=>{peek=!peek;draw()});on("skip",()=>send("room_move",{do:"vote",target:"skip"}));on("night",()=>send("room_move",{do:"next"}));
  const pk=$("#pick");if(pk)pk.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t)send("room_move",{do:"act",target:b.dataset.t});else if(b.dataset.v)send("room_move",{do:"vote",target:b.dataset.v})};
  on("end",()=>{if(confirm("End this game for everyone without a winner?"))send("room_close")});
}

/* ---------- spyfall ---------- */
let spyPick=null;
function drawSpyfall(){
  const r=room,mine=r.me.in,spy=r.role==="Spy";
  const left=Math.max(0,Math.ceil(r.at+r.time-L.serverNow()));
  setTitle("Spyfall",r.phase==="vote"?"Vote: who is the spy?":"Find the spy");
  let h=!mine?`<div class="secret hid"><small>You're watching</small><b>Shh…</b></div>`
    :`<button id="peek" style="width:100%">${!peek?`<div class="secret hid"><small>Your secret card</small><b>Tap to look</b><span>Keep your screen away from the others.</span></div>`
      :spy?`<div class="secret imp"><small>You are the</small><b>🕵 SPY</b><span>Listen closely and figure out the place. Don't get caught!</span></div>`
      :`<div class="secret"><small>The place</small><b>${esc(r.loc)}</b><span>Your role: <u>${esc(r.role)}</u></span></div>`}</button>`;
  if(r.phase==="talk"){
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="lab">Ask questions</span><span class="chip" id="spyt">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span></div>
      <p style="margin:0"><b>${esc(nameOf(r.first))}</b> starts: ask anyone a question about the place, like "Would you bring a jacket here?". Whoever answers asks the next question. Answers that are too clear help the spy!</p></div>
      ${r.me.host||left<=0?`<button class="go wide" id="votenow" style="--x:var(--pink)" ${busy?"disabled":""}>Time to vote</button>`:`<p class="muted" style="margin:0;text-align:center">${esc(nameOf(r.host))} starts the vote, or it opens when the timer ends.</p>`}`;
  }else if(r.phase==="vote"){
    const wait=r.players.filter(p=>!r.voted.includes(p.id)).map(p=>p.id);
    h+=`<div class="panel"><span class="lab">Who is the spy?</span>${mine?grid(r.players.map(p=>p.id).filter(i=>i!==me.id),r.my_vote,"v",busy):""}<p class="muted" style="margin:0;font-size:13.5px">${wait.length?"Still voting: "+esc(L.names(wait,people)):""}</p></div>`;
  }
  h+=`<div class="panel"><span class="lab">${spy?"Possible places: tap one if you know it":"Possible places"}</span><div class="seg" id="places">${r.places.map(p=>`<button data-p="${esc(p)}" class="${spyPick===p?"on":""}" ${spy?"":"disabled"} style="${spy?"":"cursor:default"}">${esc(p)}</button>`).join("")}</div>
    ${spy&&spyPick?`<button class="go wide" id="guess" style="--x:var(--pink)" ${busy?"disabled":""}>I'm sure: it's the ${esc(spyPick)}!</button><p class="muted" style="margin:0;font-size:13px">Right, and you win. Wrong, and everyone else wins.</p>`:""}</div>`;
  app.innerHTML=`<div class="col">${h}${r.me.host?`<button class="go ghost sm" id="end">End this game (no winner)</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f};
  on("peek",()=>{peek=!peek;draw()});on("votenow",()=>send("room_move",{do:"vote_now"}));
  const pk=$("#pick");if(pk)pk.onclick=e=>{const b=e.target.closest("button");if(b)send("room_move",{do:"vote",target:b.dataset.v})};
  const pl=$("#places");if(pl&&spy)pl.onclick=e=>{const b=e.target.closest("button");if(!b)return;spyPick=spyPick===b.dataset.p?null:b.dataset.p;draw()};
  on("guess",()=>send("room_move",{do:"guess",loc:spyPick}));
  on("end",()=>{if(confirm("End this game for everyone without a winner?"))send("room_close")});
}

/* ---------- codenames ---------- */
const CNC={r:{n:"Red",c:"#e5484d"},b:{n:"Blue",c:"#3b82f6"},n:{n:"Bystander",c:"#d8c39a"},a:{n:"Assassin",c:"#15181e"}};
let cnPick=null;
function drawCodenames(){
  const r=room,team=r.teams[me.id],isSpy=team&&r.spies[team]===me.id,myTurn=team===r.turn,T=CNC[r.turn];
  setTitle("Codenames",`${CNC.r.n} ${r.remain.r} left · ${CNC.b.n} ${r.remain.b} left`);
  if(cnPick!==null&&(r.open[cnPick]||r.phase!=="guess"||!myTurn))cnPick=null;
  const canGuess=myTurn&&!isSpy&&r.phase==="guess";
  const tiles=r.words.map((w,i)=>{const k=r.key[i],o=r.open[i];
    const st=o?`background:${CNC[k].c};color:${k==="n"?"#15181e":"#fff"};opacity:.9`:k?`box-shadow:inset 0 0 0 3px ${CNC[k].c}`:"";
    return `<button class="cn${o?" open":""}${cnPick===i?" sel":""}" data-i="${i}" style="${st}" ${!canGuess||o?"disabled":""}>${esc(w)}</button>`}).join("");
  const you=team?`You're on <b style="color:${CNC[team].c}">${CNC[team].n}</b>${isSpy?" as the <b>spymaster</b>: only you see the colors.":"."}`:"You're watching.";
  let act="";
  if(r.phase==="clue")act=myTurn&&isSpy?`<div class="panel"><span class="lab">Give your team a clue</span><input class="in" id="cw" placeholder="One word" autocomplete="off" value="${esc(draft)}">
      <div class="seg" id="cn">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-n="${n}" class="${String(n)===String(window.cnN)?"on":""}">${n===0?"∞":n}</button>`).join("")}</div>
      <p class="muted" style="margin:0;font-size:13px">The number is how many of your words go with the clue.</p><button class="go wide" id="giveclue" style="--x:${CNC[team].c}" ${busy?"disabled":""}>Give the clue</button></div>`
    :`<p class="muted" style="margin:0;text-align:center">Waiting for ${esc(nameOf(r.spies[r.turn]))} (${T.n} spymaster) to give a clue…</p>`;
  else act=`<div class="panel" style="text-align:center;gap:4px"><span class="lab" style="color:${T.c}">${T.n}'s clue</span><b style="font:700 30px var(--play)">${esc(r.clue.word)} · ${r.clue.n===0?"∞":r.clue.n}</b><span class="muted">${r.left>=25?"Guess as many as you like":r.left+" guess"+(r.left>1?"es":"")+" left"}</span></div>
    ${canGuess?(cnPick!==null?`<button class="go wide" id="doguess" style="--x:${CNC[team].c}" ${busy?"disabled":""}>Guess "${esc(r.words[cnPick])}"</button>`:`<p class="muted" style="margin:0;text-align:center">Talk it over with your team, then tap a word.</p>`)+`<button class="go ghost sm" id="pass" ${busy?"disabled":""}>End our turn</button>`
      :`<p class="muted" style="margin:0;text-align:center">${T.n} team is guessing…</p>`}`;
  const roster=["r","b"].map(t=>`<div class="lb-row" style="box-shadow:inset 4px 0 0 ${CNC[t].c}"><span class="n" style="white-space:normal">${Object.keys(r.teams).filter(i=>r.teams[i]===t).map(i=>esc(nameOf(i))+(r.spies[t]===i?" 🕶":"")).join(", ")}</span></div>`).join("");
  app.innerHTML=`<div class="col"><div class="panel" style="padding:12px 14px;gap:6px"><span style="font-weight:700;color:${T.c}">${T.n}'s turn</span><span class="muted" style="font-size:13.5px">${you}</span></div>
    ${act}<div class="cngrid" id="cngrid">${tiles}</div>
    <div class="panel"><span class="lab">Teams (🕶 = spymaster)</span>${roster}</div>
    ${r.me.host?`<button class="go ghost sm" id="end">End this game (no winner)</button>`:""}${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f};
  const g=$("#cngrid");g.onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;cnPick=+b.dataset.i===cnPick?null:+b.dataset.i;draw()};
  on("doguess",()=>{const i=cnPick;cnPick=null;send("room_move",{do:"guess",i})});on("pass",()=>{if(confirm("End your team's turn?"))send("room_move",{do:"pass"})});
  const cw=$("#cw");if(cw)cw.oninput=()=>{draft=cw.value};
  const cn=$("#cn");if(cn)cn.onclick=e=>{const b=e.target.closest("button");if(!b)return;window.cnN=+b.dataset.n;draw()};
  on("giveclue",()=>{if(window.cnN==null){err="Pick a number.";draw();return}const w=draft;send("room_move",{do:"clue",word:w,n:window.cnN}).then(()=>{if(!err){draft="";window.cnN=null}})});
  on("end",()=>{if(confirm("End this game for everyone without a winner?"))send("room_close")});
}

/* ---------- results ---------- */
function drawDone(){
  stopRace();
  const r=room,f=r.final||[];
  setTitle(r.label,"Game over");
  if(!f.length){app.innerHTML=`<div class="panel"><p class="big">This game was closed</p><button class="go" id="hub">All games</button></div>`;$("#hub").onclick=()=>openRoom(null);return}
  let head="";
  if(r.game==="imposter"){
    const caught=r.caught,iw=r.winner==="imposter";
    head=`<div class="panel" style="text-align:center;gap:8px"><span class="lab">The imposter was</span><div class="row" style="justify-content:center">${av(r.imposter,52)}<b style="font:700 26px var(--play)">${esc(nameOf(r.imposter))}</b></div>
      <p style="margin:0">The word was <b>${esc(r.word)}</b> (${esc(r.cat)}).</p>
      <p class="big" style="color:${iw?"var(--pink)":"var(--green)"}">${iw?(caught?"Caught, but guessed the word!":"The imposter got away!"):"Caught! The others win."}</p>
      ${caught&&r.guess!==null?`<p class="muted" style="margin:0">Their guess: "${esc(r.guess)}"</p>`:""}
      <p class="muted" style="margin:0;font-size:13.5px">Votes: ${Object.entries(r.tally||{}).sort((a,b)=>b[1]-a[1]).map(([id,n])=>esc(nameOf(id))+" "+n).join(" · ")}</p></div>`;
  }else if(r.game==="werewolf"){
    const wolves=r.winner==="wolves";
    head=`<div class="panel" style="text-align:center;gap:8px"><p class="big" style="color:${wolves?"#e5484d":"var(--green)"}">${wolves?"🐺 The wolves win!":"🏡 The village wins!"}</p>
      <div class="col" style="gap:6px;text-align:left">${Object.entries(r.roles||{}).map(([id,k])=>`<div class="lb-row">${av(id,30)}<span class="n">${esc(nameOf(id))}</span><span class="chip">${WW[k].ic} ${WW[k].n}</span></div>`).join("")}</div></div>`;
  }else if(r.game==="spyfall"){
    const sw=r.winner==="spy",how={caught:"The spy was caught!",wrong:"Wrong person! The spy got away.",guessed:"The spy guessed the place!",missed:"The spy guessed wrong."}[r.how]||"";
    head=`<div class="panel" style="text-align:center;gap:8px"><span class="lab">The spy was</span><div class="row" style="justify-content:center">${av(r.spy,52)}<b style="font:700 26px var(--play)">${esc(nameOf(r.spy))}</b></div>
      <p style="margin:0">The place was <b>${esc(r.loc)}</b>.${r.guess?` The spy guessed <b>${esc(r.guess)}</b>.`:""}</p><p class="big" style="color:${sw?"var(--pink)":"var(--green)"}">${how}</p></div>`;
  }else if(r.game==="codenames"){
    const W=CNC[r.winner];
    head=`<div class="panel" style="text-align:center;gap:8px"><p class="big" style="color:${W.c}">${W.n} team wins!</p><div class="cngrid">${r.words.map((w,i)=>`<span class="cn open" style="background:${CNC[r.key[i]].c};color:${r.key[i]==="n"?"#15181e":"#fff"};opacity:${r.open[i]?1:.45}">${esc(w)}</span>`).join("")}</div></div>`;
  }else{
    const w=f.filter(x=>x.place===1).map(x=>esc(nameOf(x.id)));
    head=`<p class="big">${w.length>1?w.join(" & ")+" tie!":w[0]+" wins!"}</p>`;
  }
  const res=r.results||{};
  app.innerHTML=`<div class="col">${head}
    <div class="res">${f.map(x=>{const c=x.place?coinsFor(x.place)+(x.bonus||0):0,rs=res[x.id];
      const note=r.game==="race"?(rs?(rs.win?rs.left+" seconds left":"Scored "+rs.score+", time ran out"):"Didn't finish"):r.game==="imposter"?(x.id===r.imposter?"The imposter":"Knew the word"):r.game==="werewolf"?(WW[(r.roles||{})[x.id]]||{}).n||"":r.game==="spyfall"?(x.id===r.spy?"The spy":"Knew the place"):r.game==="codenames"?CNC[r.teams[x.id]].n+" team"+(r.spies[r.teams[x.id]]===x.id?" spymaster":""):r.game==="trivia"?x.score+" points (seconds left on right answers)":r.game==="likely"?x.score+" matching pick"+(x.score===1?"":"s"):r.game==="reaction"?(x.place===1?"Last one standing":"Out"):"";
      return `<div class="rr${x.place===1?" first":""}"><span class="pl">${x.place||"–"}</span>${av(x.id,40)}<span class="t"><b>${esc(nameOf(x.id))}</b><small>${note}</small></span>
        <span class="v">${r.score?"+"+c:""}<small>${r.score?(x.bonus?`coins (${x.bonus} for time)`:"coins"):""}</small></span></div>`}).join("")}</div>
    ${r.event_id?`<p class="saved">${r.score?"✓ Saved to the scoreboard":"✓ Saved to the Game log as practice (not on the scoreboard)"}</p>`:r.score?`<p class="muted" style="text-align:center;margin:0">Not saved: nobody won anything.</p>`:""}
    <div class="row" style="justify-content:center">${r.me.host?`<button class="go" id="again" style="--x:${GAMES[r.game].x}" ${busy?"disabled":""}>Play again, same players</button>`:`<p class="muted" style="margin:0">If ${esc(nameOf(r.host))} starts another round, your phone follows.</p>`}
      <button class="go ghost" id="hub">All games</button></div>${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
  $("#hub").onclick=()=>openRoom(null);
  const a=$("#again");if(a)a.onclick=()=>send("room_again",{when:RG.nowLocal()});
}

/* ---------- start ---------- */
(async function(){
  try{
    const r=await RG.login();me=r.me;(r.state.players||[]).forEach(p=>people[p.id]=p);people[me.id]=Object.assign({},people[me.id]||{},me);
    if(r.state.coins)coins=r.state.coins;window.bonusPer=r.state.bonus_per;
  }catch(e){app.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const q=new URLSearchParams(location.search),id=+q.get("room"),nw=q.get("new");
  const pre=(q.get("players")||"").split(",").filter(i=>people[i]&&i!==me.id); // e.g. from the map: play.html?new=imposter&players=rasha,sofia
  const keep=pre.length?{players:pre}:{};["mind","level","cat","chips"].forEach(k=>{const v=q.get(k);if(v)keep[k]=/^\d+$/.test(v)?+v:v});
  if(id>0)openRoom(id);else if(nw&&GAMES[nw])newGame(nw,keep);else openRoom(null);
})();
})();
</script>
